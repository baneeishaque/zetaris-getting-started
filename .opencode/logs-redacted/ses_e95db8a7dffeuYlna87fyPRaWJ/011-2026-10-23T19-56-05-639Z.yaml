      readonly chart = computed(() => {
       const obs = this.observations();
       if (obs.length === 0) return null;
       const rates = obs.map(o => o.rate);
       const min = Math.min(...rates); const max = Math.max(...rates);
       const range = max - min || 1;
       const width=600, height=180, pad=24;
       const points = obs.map((o,i) => {
        const x = obs.length === 1 ? width/2 : pad + (i/(obs.length-1))*(width-2*pad);
        const y = height-pad - ((o.rate-min)/range)*(height-2*pad);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
       }).join(' ');
       return { points, min, max, first: obs[0].period, last: obs[obs.length-1].period, width, height, pad };
      });
