      import { HttpClient } from '@angular/common/http';
      import { Injectable, inject } from '@angular/core';
      import { firstValueFrom } from 'rxjs';
      import type { Observation, SeriesData, SeriesFilters } from '../series/saved-series.model';
      import type { JsonStatDataset } from './eurostat.models';

      const BASE_URL = ...
      const CACHE_TTL_MS = 300_000;

      interface CacheEntry { data: SeriesData; fetchedAt: number; }

      export class EurostatDataError extends Error {
        constructor(message: string, readonly cause?: unknown) { super(message); this.name='EurostatDataError'; }
      }

      @Injectable({ providedIn: 'root' })
      export class EurostatService {
        private readonly http = inject(HttpClient);
        private readonly cache = new Map<string, CacheEntry>();

        async getSeries(filters: SeriesFilters): Promise<SeriesData> {
          const key = `${filters.geo}:${filters.sex}`;
          const cached = this.cache.get(key);
          if (cached && Date.now() - cached.fetchedAt < CACHE_TTL_MS) return cached.data;
          const url = this.buildUrl(filters);
          let response: JsonStatDataset;
          try { response = await firstValueFrom(this.http.get<JsonStatDataset>(url)); }
          catch (error) { throw new EurostatDataError(this.message(filters, 'could not be loaded'), error); }
          const data = this.decode(response, filters);
          this.cache.set(key, { data, fetchedAt: Date.now() });
          return data;
        }

        private buildUrl(filters: SeriesFilters): string {
          const params = new URLSearchParams({ format:'JSON', lang:'EN', freq:'M', s_adj:'SA', age:'TOTAL', unit:'PC_ACT', sex:filters.sex, geo:filters.geo });
          return `${BASE_URL}?${params.toString()}`;
        }

        private decode(response: JsonStatDataset, filters: SeriesFilters): SeriesData {
          if (!response || response.class !== 'dataset') throw new EurostatDataError(this.message(filters, 'returned an unexpected dataset class'));
          if (!Array.isArray(response.id) || !Array.isArray(response.size)) throw ...
          if (response.id.length !== response.size.length) throw ...
          const timeDimension = response.id.indexOf('time');
          if (timeDimension === -1) throw ...
          const timeDimensionData = response.dimension?.['time'];
          const timeIndex = timeDimensionData?.category?.index;
          if (!timeIndex || typeof timeIndex !== 'object') throw ...
          if (!response.value || typeof response.value !== 'object') throw ...
          const strides = response.size.map((_, index) => response.size.slice(index + 1).reduce((product, size) => product * size, 1));
          const base = response.id.map(() => 0);
          const observations: Observation[] = [];
          for (const [period, position] of Object.entries(timeIndex)) {
            if (!Number.isInteger(position) || position < 0) continue; // or throw malformed? Better throw? A malformed index should be rejected. Use throw.
            base[timeDimension] = position;
            const flat = base.reduce((sum, categoryIndex, dimension) => sum + categoryIndex * strides[dimension], 0);
            const value = response.value[String(flat)];
            if (typeof value === 'number' && Number.isFinite(value)) observations.push({ period, rate: value });
          }
          if (observations.length === 0) throw new EurostatDataError(this.message(filters, 'returned no observations'));
          observations.sort((left,right)=>left.period.localeCompare(right.period));
          return { datasetLabel: response.label, source: response.source, updated: response.updated, observations };
        }

        private message(filters: SeriesFilters, detail: string): string {
          return `Eurostat series ${filters.geo}/${filters.sex} ${detail}.`;
        }
