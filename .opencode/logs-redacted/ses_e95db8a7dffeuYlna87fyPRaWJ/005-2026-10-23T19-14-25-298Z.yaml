          6: 
          7: # OpenCode Current Session ID (v1)
          8: 
          9: ## Composition Rationale
          10: 
          11: This skill is a **composer**: it does NOT re-implement glob-sorting or YAML parsing. It sequences two base skills:
          12: 
          13: 1. [`file-glob-sort-by-mtime`](../../general/file/file-glob-sort-by-mtime/SKILL.md) — finds the newest `.yaml` file in
          14:    `.opencode/logs/`
          15: 2. [`yaml-field-extract`](../../general/yaml-field-extract/SKILL.md) — extracts `session.id` and `title` from the YAML
          16:    header
          17: 
          18: The composer's value-add: orchestrating the pipeline, resolving relative script paths, and cross-verifying the state
          19: file exists.
          20: 
          21: ## When to Use
          22: 
          23: - You need to know the current opencode session ID programmatically
          24: - You are composing a larger workflow that needs the session ID for traceability
          25: 
          26: ## Environment & Dependencies
          27: 
          28: | Requirement | Version | Notes |
          29: | ------------- | --------- | ------- |
          30: | Python | 3.12+ | Stdlib only |
          31: | PyYAML | any | Required by yaml-field-extract (PEP 723 inline metadata) |
          32: | `.opencode/logs/` | — | Must exist (created by opencode logger plugin) |
          33: 
          34: ## CLI Contract
          35: 
          36: | Argument | Required | Description |
          37: | ---------- | ---------- | ------------- |
          38: | _(none)_ | — | Runs the full pipeline with auto-discovered repo root and log dir |
          39: | `--log-dir PATH` | No | Override `.opencode/logs/` directory (default: `<repo-root>/.opencode/logs` or `$OPENCODE_LOGS_DIR`) |
          40: | `--repo-root PATH` | No | Override repo root discovery (default: `$OPENCODE_REPO_ROOT` / `$AI_SUITE_ROOT`, then `git rev-parse --show-toplevel`, then legacy `parents[4]`) |
          41: | `--json` | No | Emit single-line JSON instead of human-readable text |
          42: | `--state {exists,missing,any}` | No | Gate on state-file presence (default: `any`; mismatch exits 2) |
          43: | `--since ISO_TIMESTAMP` | No | Filter sessions by `st_mtime >= timestamp` (e.g. `2026-09-19T10:00:00`) |
          44: | `--pending-ttl SECONDS` | No | In-flight (`*-pending-*.yaml`) markers older than this are stale; `0` disables (default: `3600`) |
          45: | `--dry-run` | No | Print discovered paths (repo_root, log_dir, base scripts) as JSON and exit without extractors |
          46: 
          47: **Output (text, default):**
          48: 
          49: ```text
          50: Session ID: ses_XXXXXXXXXXXXX
          51: Title: My Session Title
          52: State file: exists
          53: Pending marker: yes
          54: ```
          55: 
          56: **Exit codes:**
          57: 
          58: - `0` — session ID found (and state gate satisfied when `--state` given)
          59: - `1` — any pipeline step failed (missing log, missing key, etc.)
          60: - `2` — session found but `--state` gate mismatched (`--json` still prints the payload)
          61: 
          62: **Output (`--json`):**
          63: 
          64: ```json
          65: {"session_id": "ses_XXXXXXXXXXXXX", "title": "My Session Title", "state": "exists", "pending": true, "yaml_path": "<path>", "log_dir": "<path>"}
          66: ```
          67: 
          68: `title` is `null` when the YAML header has no `title` key.
          69: 
          70: ## Protocol
          71: 
          72: 1. Run `python3 scripts/find-current-session.py`
          73: 2. Read stdout for session ID, title, state-file presence, and the pending-marker flag.
          74: 3. Verify before use: `Pending marker: yes` confirms the winning session has an
          75:    in-flight turn — the strongest "you are inside this session" signal.
          76:    `Pending marker: no` means selection fell back to newest-mtime; accept it only
          77:    when no other session could plausibly be active, otherwise treat the result as
          78:    ambiguous and surface the candidates instead of guessing.
          79: 4. Never substitute a session ID remembered from artifact filenames, scratch
          80:    folders, or earlier conversation — IDs change on fork; re-run discovery at the
          81:    point of use.
          82: 
          83: ## Edge Cases
          84: 
          85: - **No YAML logs exist**: exits 1 with "could not find newest YAML log"
          86: - **YAML header missing session.id**: exits 1 with the header path and base stderr detail
          87: - **Newest header corrupt**: next-newest `ses_*/` dir is tried before the flat fallback
          88: - **No state file**: still succeeds (reports "missing") unless `--state exists` (exits 2)
          89: - **`--since` filters all sessions**: exits 1 with "could not find newest YAML log"
          90: - **Symlinked log dir**: follows symlinks via `Path.rglob`
          91: - **Concurrent sessions in the same repo**: selection is pending-marker-first —
          92:   the active session has an in-flight `NNN-pending-*.yaml` in its dir — then
          93:   newest-mtime. When two sessions are genuinely in-flight, the script warns on
          94:   stderr and selects the newest pending one; treat that as ambiguous, verify
          95:   against your own context, and surface the candidates instead of guessing.
          96: - **Stale pending marker**: a crashed or force-quit turn can leave an orphan
          97:   `NNN-pending-*.yaml` behind; markers older than `--pending-ttl` (default
          98:   3600s) are ignored.
          99: - **Deduced ID (never)**: an ID seen in artifact filenames, scratch folders, or
          100:   prior conversation is not the current session's ID after a fork — re-run
          101:   discovery instead of passing a remembered value.
          102: 
          103: ## Prohibited Actions
          104: 
          105: - Do NOT re-derive the sort or YAML extraction logic inline — always delegate to the base skill scripts.
          106: - Do NOT hardcode log directory paths — use `.opencode/logs/` relative to repo root.
          107: - Do NOT deduce, carry, or reuse a session ID from artifact filenames, scratch
          108:   directories, or prior conversation context — IDs change when a session is
          109:   forked. Resolve via discovery in the current run and verify the pending-marker
          110:   flag before passing the ID to consumer scripts.
          111: 
          112: ## Script Reference
          113: 
          114: `find-current-session.py`:
          115: 
          116: 1. Resolves repo root via `$OPENCODE_REPO_ROOT` / `$AI_SUITE_ROOT`, git top-level, legacy `parents[4]` fallback (cached
          117:    per-process via `lru_cache`)
          118: 2. Resolves base script paths under repo root (with `SCRIPT_DIR`-relative fallback)
          119: 3. Resolves log dir via `--log-dir`, `$OPENCODE_LOGS_DIR`, or `<repo-root>/.opencode/logs`
          120: 4. If `--dry-run`: emits discovery JSON and exits
          121: 5. Orders `ses_*/` dirs pending-marker-first then newest-mtime (filtered by `--since` if given), probes top 5 in
          122:    parallel via `ThreadPoolExecutor` (order-preserving `executor.map`), accepting the first header in that order
          123:    whose `session.id` parses; warns on stderr when multiple sessions have in-flight turns
          124: 6. Runs `sort-by-mtime.py` on `.opencode/logs/` with glob `*.yaml` and `--limit 1`
          125: 7. Parses JSON Lines output to get the newest file path
          126: 8. Runs `extract-field.py` twice: once for `session.id`, once for `title`
          127: 9. Checks for `.opencode/logs/<sid>.state.json`
          128: 10. Applies `--state` gate (exit 2 on mismatch; `--json` still prints payload)
          129: 11. Prints results (incl. the pending-marker flag)
          130: 
          131: ## Composition by Lower-Level Skills
          132: 
          133: | Primitive | Composition Mechanism |
          134: | ----------- | ---------------------- |
          135: | `file-glob-sort-by-mtime` | `sort-by-mtime.py --dir .opencode/logs --glob *.yaml --limit 1` → newest path |
          136: | `yaml-field-extract` | `extract-field.py --file <path> --key session.id` → session ID |
