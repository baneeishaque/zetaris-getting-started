              of reports.
            - [Contributing conventions](../../CONTRIBUTING.md) — source packages, documentation placement, and license checks.
            - [Connection guide](../connections/README.md) and [client setup](../connections/client-setup.md) — REST and SQL
              helper contracts.
            - [Lightning SQL companion](../guides/zetaris-lightning-sql-companion.md) — JSON-stat decode technique and confirmed
              platform limits.
