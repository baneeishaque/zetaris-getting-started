            seasonally adjusted, monthly. The `une_rt_m_pl_series_table` view decodes the sparse JSON-stat value object into
            one row per published month. The metadata and snapshot views are low-risk helpers that avoid `explode()`.

            The Zetaris objects do **not** call the API at query time in a browser sense. They are registered REST tables
            inside Zetaris. The app-facing story is the public API; the SQL-facing story is the registered table and views.
            See [`zetaris-integration.md`](zetaris-integration.md).

