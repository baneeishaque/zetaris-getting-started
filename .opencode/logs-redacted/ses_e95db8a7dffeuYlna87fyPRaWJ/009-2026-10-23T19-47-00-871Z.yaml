          -- === Example queries ===
          -- Queries 1-3 use the metadata and snapshot views (no explode() involved);
          -- queries 4-8 use the fully-decoded une_rt_m_pl_series_table.

          -- 1. Dataset descriptive metadata -- confirms which dataset, which
