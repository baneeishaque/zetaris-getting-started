        result: "  Unemployment by sex and age - monthly data (une\\_rt\\_m)      \n\n[\n\nGo to top button\n\nBack to top\n\n](#)\n\nReference metadata describe statistical concepts and methodologies used for the collection and generation of data. They provide information on data quality and, since they are strongly content-oriented, assist users in interpreting the data. Reference metadata, unlike structural metadata, can be decoupled from the data.\n\nFor more information, please consult our [metadata website section](https://ec.europa.eu/eurostat/web/metadata/overview).\n\nClose\n\n[![Eurostat logo](https://ec.europa.eu/eurostat/cache/metadata/img/estat-logo.svg)](https://ec.europa.eu/eurostat)\n\nReference metadata ![Information message](https://ec.europa.eu/eurostat/cache/metadata/img/i111.jpg) \n\n![](https://ec.europa.eu/eurostat/cache/metadata/img/img111.png)\n\n---\n\n# Unemployment by sex and age - monthly data (une\\_rt\\_m)\n\n[![Print](https://ec.europa.eu/eurostat/cache/metadata/img/print111.jpg)](#)[![Download](https://ec.europa.eu/eurostat/cache/metadata/img/download111.jpg)](https://ec.europa.eu/eurostat/api/dissemination/files?file=metadata/une_rt_m_esms.sdmx.zip)\n\nReference Metadata in Euro SDMX Metadata Structure (ESMS)\n\nCompiling agency: Eurostat, the statistical office of the European Union.\n\nNeed help? Contact the [Eurostat user support](https://ec.europa.eu/eurostat/contact-us/user-support)\n\n---\n\nShort metadata Check mark for short metadata Check mark for full metadata Full metadata\n\n\_\n\nCollapse all\n\nExpand all\n\n## Contents\n\n## [1\\. Contact](#contactDisseminated)\n\n## [2\\. Metadata update](#meta_updateDisseminated)\n\n## [3\\. Statistical presentation](#stat_presDisseminated)\n\n## [4\\. Unit of measure](#unit_measureDisseminated)\n\n## [5\\. Reference Period](#ref_periodDisseminated)\n\n## [6\\. Institutional Mandate](#inst_mandateDisseminated)\n\n## [7\\. Confidentiality](#confDisseminated)\n\n## [8\\. Release policy](#rel_policyDisseminated)\n\n## [9\\. Frequency of dissemination](#freq_dissDisseminated)\n\n## [10\\. Accessibility and clarity](#accessibility_clarityDisseminated)\n\n## [11\\. Quality management](#quality_mgmntDisseminated)\n\n## [12\\. Relevance](#relevanceDisseminated)\n\n## [13\\. Accuracy](#accuracyDisseminated)\n\n## [14\\. Timeliness and punctuality](#timeliness_punctDisseminated)\n\n## [15\\. Coherence and comparability](#coher_comparDisseminated)\n\n## [16\\. Cost and Burden](#cost_burdenDisseminated)\n\n## [17\\. Data revision](#data_revDisseminated)\n\n## [18\\. Statistical processing](#stat_processDisseminated)\n\n## [19\\. Comment](#comment_dsetDisseminated)\n\n## [Related metadata](#relatedmdDisseminated)\n\n## [Annexes](#annexDisseminated)\n\n## [Footnotes](#footnoteDisseminated)\n\n## [Data description](#shortdata_descrDisseminated)\n\n## [Metadata last update](#shortmeta_last_updateDisseminated)\n\n## [Statistical concepts and definitions](#shortstat_conc_defDisseminated)\n\n## [Statistical unit](#shortstat_unitDisseminated)\n\n## [Statistical population](#shortstat_popDisseminated)\n\n## [Reference area](#shortref_areaDisseminated)\n\n## [Reference Period](#shortref_periodDisseminated)\n\n## [Accuracy - overall](#shortaccuracy_overallDisseminated)\n\n## [Unit of measure](#shortunit_measureDisseminated)\n\n## [Data compilation](#shortdata_compDisseminated)\n\n## [Source data](#shortsource_typeDisseminated)\n\n## [Frequency of dissemination](#shortfreq_dissDisseminated)\n\n## [Timeliness](#shorttimelinessDisseminated)\n\n## [Comparability - geographical](#shortcompar_geoDisseminated)\n\n## [Comparability - over time](#shortcompar_timeDisseminated)\n\n## 1\\. Contact accordion arrow down accordion arrow up\n\n### 1.1. Contact organisation\n\nEurostat, the statistical office of the European Union.\n\n### 1.2. Contact organisation unit\n\n\\[4D1\\_F3\\] Eurostat - Labour market and skills\n\n### 1.3. Contact name\n\nConfidential because of GDPR\n\n### 1.4. Contact person function\n\nConfidential because of GDPR\n\n### 1.5. Contact mail address\n\n2920 Luxembourg LUXEMBOURG\n\n### 1.6. Contact email address\n\nConfidential because of GDPR\n\n### 1.7. Contact phone number\n\nConfidential because of GDPR\n\n### 1.8. Contact fax number\n\nConfidential because of GDPR\n\n## 2\\. Metadata update accordion arrow down accordion arrow up\n\n### 2.1. Metadata last certified\n\n8 January 2026\n\n### 2.2. Metadata last posted\n\n8 January 2026\n\n### 2.3. Metadata last update\n\n8 January 2026\n\n## 3\\. Statistical presentation accordion arrow down accordion arrow up\n\n### 3.1. Data description\n\n'Unemployment by sex and age - monthly data' is a dataset with series on a monthly basis which is, where necessary, adjusted and enriched in various ways, in accordance with the specificities of the indicator.\_The monthly unemployment indicator is calculated with special methods and periodicity which justify the present page.\n\nQuarterly and annual unemployment is published in the section 'LFS main indicators', which is a collection of the main statistics on the labour market.\_\n\nThis page focuses on the particularities of the estimation of harmonised unemployment (including unemployment rates). Other information on 'LFS main indicators' can be found in the respective ESMS page, see link in section 'related metadata'.\_\n\n### 3.2. Classification system\n\nFor more details on classifications, levels of aggregation and transition rules, please consult\_[EU-LFS (Statistics Explained) - Methodology](http://ec.europa.eu/eurostat/statistics-explained/index.php/EU_labour_force_survey_-_methodology \"EU-LFS (Statistics Explained) - Methodology\").\n\n### 3.3. Coverage - sector\n\nNot applicable.\n\n### 3.4. Statistical concepts and definitions\n\nThe definitions of employment and unemployment, as well as other survey characteristics follow the definitions and recommendations of the International Labour Organisation. The definition of unemployment is further precised in Commission Regulation (EC) No\_2019/2240.\n\nThe relevant definitions are as follows:\n\n**Unemployed persons**\_are all persons 15 to 74 years of age who were not employed during the reference week, had actively sought work during the past four weeks and were ready to begin working immediately or within two weeks. Figures show the number of persons unemployed in thousands.\n\nThe duration of unemployment is defined as the duration of a search for a job or as the length of the period since the last job was held (if this period is shorter than the duration of search for a job).\n\n**Employed persons**\_are all persons who worked at least one hour for pay or profit during the reference week or were temporarily absent from such work. This variable is needed for the calculation of the unemployment rate,\_the long term unemployment rate and the very long term unemployment rate (see definition below). For the unemployment rate, only persons from 15 to 74 years of age are used.\n\n**The unemployment rate**\_is the number of people unemployed as a percentage of the labour force. The labour force is the total number of people employed and unemployed. In the database, unemployment rates can be downloaded by choosing the unit \"PC\\_ACT\", Percentage of Active Population.\n\nThe\_**active population**\_(labour force) is defined as the sum of employed and unemployed persons.\n\n### 3.5. Statistical unit\n\nPersons.\n\n### 3.6. Statistical population\n\nThe EU LFS results cover the total population usually residing in Member States, except for persons living in collective or institutional households. While demographic data are gathered for all age groups, questions relating to labour market status are restricted to persons in the age group of 15 years or older. For more details and exceptions, please consult please consult the\_[EU-LFS (Statistics Explained) - Methodology](http://ec.europa.eu/eurostat/statistics-explained/index.php/EU_labour_force_survey_-_methodology \"EU-LFS (Statistics Explained) - Methodology\").\n\n### 3.7. Reference area\n\nEuropean Union, Euro area, EU Member States, Candidate Countries, EFTA Countries (except for Liechtenstein).\n\nData for Cyprus refer only to the areas of Cyprus controlled by the Government of the Republic of Cyprus.\n\nData for France include the overseas departments (DOM).\_\n\nData for USA and Japan are also disseminated.\n\n### 3.8. Coverage - Time\n\nAvailable data ranges differ by Member State. Earliest data series\_available\_for unemployment rates and averages are by month start from 1983 onwards.\n\n### 3.9. Base period\n\nNot applicable.\_\n\n## 4\\. Unit of measure accordion arrow down accordion arrow up\n\nUnemployment rates are expressed in percentage (see definition above in section 3.4), while unemployment levels are thousands of persons.\n\n## 5\\. Reference Period accordion arrow down accordion arrow up\n\nThe reference periods are the calendar months.\_\n\n## 6\\. Institutional Mandate accordion arrow down accordion arrow up\n\n### 6.1. Institutional Mandate - legal acts and other agreements\n\nThe EU-LFS implementation is governed by legislative acts of the Council and Parliament, as well as of the Commission. The principal legal act is the\_Regulation (EU) 2019/1700. The implementation rules are specified in the successive Commission regulations, in particular Commission Implementing Regulation 2019/2241. For more details on the\_regulations, please consult\_[EU-LFS (Statistics Explained) - Main features and legal basis](http://ec.europa.eu/eurostat/statistics-explained/index.php/EU_labour_force_survey_%E2%80%93_main_features_and_legal_basis \"EU-LFS (Statistics Explained) - Main features and legal basis\").\n\n### 6.2. Institutional Mandate - data sharing\n\nNot applicable.\n\n## 7\\. Confidentiality accordion arrow down accordion arrow up\n\n### 7.1. Confidentiality - policy\n\nNot applicable.\n\n### 7.2. Confidentiality - data treatment\n\nNot applicable.\n\n## 8\\. Release policy accordion arrow down accordion arrow up\n\n### 8.1. Release calendar\n\nMonthly unemployment data is bound by a release calendar.\n\n### 8.2. Release calendar access\n\nFor monthly unemployment data - the precise date of data release is disseminated on [Eurostat's website](http://ec.europa.eu/eurostat/news/release-calendar \"Eurostat's website\").\n\nPlease also consult the yearly calendar under\_[Euro indicators - Eurostat (europa.eu)](https://ec.europa.eu/eurostat/web/main/news/release-calendar?start=1708902000000&type=dayGridWeek&theme=3&eventtype=1 \"Euro indicators - Eurostat (europa.eu)\")\n\n### 8.3. Release policy - user access\n\nIn line with the Community legal framework and the [European Statistics Code of Practice](https://ec.europa.eu/eurostat/documents/4031688/8971242/KS-02-18-142-EN-N.pdf/e7f85f07-91db-4312-8118-f729c75878c7 \"European Statistics Code of Practice\") Eurostat disseminates European statistics on Eurostat's website (see item 10 - 'Accessibility and clarity') respecting professional independence and in an objective, professional and transparent manner in which all users are treated equitably. The detailed arrangements are governed by the [Eurostat protocol on impartial access to Eurostat data for users](https://ec.europa.eu/eurostat/about-us/impartiality-protocol \"Eurostat protocol on impartial access to Eurostat data for users\").\n\nIn line with this protocol and on a strictly regulated basis, data on monthly unemployment are sent for information to the European Central Bank (ECB) and to the European Commission Directorate General for Employment, Social Affairs and Equal Opportunities (DG EMPL) under embargo the evening before official release of data.\n\n## 9\\. Frequency of dissemination accordion arrow down accordion arrow up\n\nMonthly.\n\n## 10\\. Accessibility and clarity accordion arrow down accordion arrow up\n\n### 10.1. Dissemination format - News release\n\nNews releases on-line (only for monthly unemployment).\n\n### 10.2. Dissemination format - Publications\n\nMonthly news release. Dedicated page on [Unemployment Statistics](http://ec.europa.eu/eurostat/statistics-explained/index.php/Unemployment_statistics \"Unemployment Statistics\") in \"Statistics Explained\".\n\n### 10.3. Dissemination format - online database\n\nPlease consult free data on-line [Eurostat database.](https://ec.europa.eu/eurostat/data/database \"Database\")\n\n### 10.4. Dissemination format - microdata access\n\nNot applicable.\n\n### 10.5. Dissemination format - other\n\nSee information at this website ([Eurostat).](https://ec.europa.eu/eurostat \"Eurostat).\")\n\n### 10.6. Documentation on methodology\n\nThe EU-LFS disseminates publications on the methodology of the survey. For more information please consult: [Quality reports and methodological publications](https://ec.europa.eu/eurostat/web/lfs/quality \"LFS Quality\").\n\n### 10.7. Quality management - documentation\n\nSee section 11.1.\n\n## 11\\. Quality management accordion arrow down accordion arrow up\n\n### 11.1. Quality assurance\n\nPlease refer to the ESMS page on 'Employment and unemployment (LFS)' (see link below in section 'related metadata').\n\n### 11.2. Quality management - assessment\n\nPlease refer to the ESMS page on 'Employment and unemployment (LFS)' (see link below in section 'related metadata').\n\nPlease refer to Annex III - Quality assesment of MUR data.\_\n\n## 12\\. Relevance accordion arrow down accordion arrow up\n\n### 12.1. Relevance - User Needs\n\nRelevance is high. Unemployment rates are among the most important socio-economic indicators. Monthly unemployment rates are Eurostat Euro-indicators;\_\n\n### 12.2. Relevance - User Satisfaction\n\nOverall, users are satisfied with the quality of the monthly unemployment statistics disseminated in Eurostat’s website. This is true for all the assessed quality dimensions with no exception. Accessibility and accuracy are the most highly rated quality dimensions, with accuracy being the most important dimension according to users.\_\n\n### 12.3. Completeness\n\nThe time series are complete from the moment they start.\n\n## 13\\. Accuracy accordion arrow down accordion arrow up\n\n### 13.1. Accuracy - overall\n\nThe overall accuracy is considered as high. Unemployment is arguably the most important variable collected by EU-LFS, the survey design is optimized to measure unemployment.\n\n### 13.2. Sampling error\n\nNot available on monthly basis.\n\n### 13.3. Non-sampling error\n\nNot available on monthly basis.\n\n## 14\\. Timeliness and punctuality accordion arrow down accordion arrow up\n\n### 14.1. Timeliness\n\nMonthly data on seasonally adjusted unemployment rates are published approximately 31 days after the end of the reference month.\_\n\n### 14.2. Punctuality\n\nNot available.\n\n## 15\\. Coherence and comparability accordion arrow down accordion arrow up\n\n### 15.1. Comparability - geographical\n\nFor France, the LFS results for the monthly calculations are complemented with the DOM data (départements d'outre-mer).\n\n### 15.2. Comparability - over time\n\nIn the monthly dataset, the idea is to keep the time series as comparable in time as possible. It means that possible breaks in the LFS series due to changes in the definitions or in the filtering of the micro data have been adjusted.\n\n### 15.3. Coherence - cross domain\n\nOften questions are asked concerning coherence with registered unemployment. Both indicators are not comparable. First they have different definitions, registration rules are not harmonised internationally and they do not correspond to ILO (International Labour Organization) standards.\_There could be other reasons for differences: different geographical coverage (e.g. regions excluded), different time coverage, etc.\n\n### 15.4. Coherence - internal\n\nThe headline figures published in the monthly Unemployment News Release are seasonally adjusted unemployment rates. The non-seasonally adjusted monthly data are consistent with the published LFS data.\n\n## 16\\. Cost and Burden accordion arrow down accordion arrow up\n\nNot available.\n\n## 17\\. Data revision accordion arrow down accordion arrow up\n\n### 17.1. Data revision - policy\n\nTo further specify the\_[general Eurostat revision policy](https://ec.europa.eu/eurostat/web/quality/quality-monitoring/eurostat-quality-initiatives \"general Eurostat revision policy\"), the following revision policy has been established for the monthly unemployment rate.\n\n### 17.2. Data revision - practice\n\nAll reported errors (once validated) result in corrections of the disseminated data.\n\nReported errors are corrected in the disseminated data as soon as the correct data have been validated.\n\nData are only published once they are deemed to be sufficiently complete for all data providers contributing to the aggregate.\n\n1\\. Routine revisions\n\nWhenever new data are provided and validated, the already disseminated data are updated. Aggregates and components are revised at the same time.\n\nThere are routine revisions aiming at adjusting monthly time series to have temporal consistency with the quarterly series.\n\nEvery month new not seasonally adjusted figures are added into the process and new estimates are calculated. This might cause a slight revision in the past figures due to the re-execution of the seasonal adjustment procedure.\_\n\nSeasonal Adjustment models are updated annually. During the years 2020 and 2021, the seasonal coefficients of the months of the year 2019 have been applied due uncertainties in the seasonal figure caused by the Corona crisis. With the January 2023 data release the annual review of models is re-established, using JDemetra+. After each annual review, routine revisions may appear to seasonally adjusted data.\n\nWhenever new EU-LFS data become available, a potentially larger revision takes place. For countries using registered unemployment counts, data are usually revised for the last 1 to 6 months, upon inclusion of the new LFS data. In addition, for those countries parameters used in the ARIMA models are reviewed every time new EU-LFS quarterly data becomes available. Data are considered to be final after 6 months for routine revisions.\n\nThe revision calendar for the domain is identical with the dissemination calendar of the monthly unemployment release.  \nRoutine revisions are communicated in the paragraph “Revisions and timetable” of the monthly news release.\n\nThe revisions due to the latest inclusion of EU-LFS data are noted in the Monthly Unemployment Release published on 1. September 2026.\_\n\nAmong EU Member States, the rate has been revised by more than 0.1 percentage points (pp) downwards for Lithuania (by 0.7 pp). The rate has been revised by more than 0.1 percentage points (pp) upwards for Cyprus (by 0.8 pp), Bulgaria and Romania (by 0.5 pp each) as well as for Estonia, Latvia and Poland (by 0.3 pp each).\n\n2\\. Major revisions\n\nThe impact of major revisions is analysed visually. Time series breaks caused by major revisions are flagged until break-free data is provided.  \n  \nMajor revisions are documented below (overview of significant revisions of back data published since October 2023):\n\nSweden: data revised back to January 2001 due to methodological changes in the Framework Regulation, published on 20 October 2023.\n\nCroatia: data revised for all months of 2022 due to Census 2021 revisions, published on 3 November 2023.\n\nIreland: data revised from July 2016 to September 2023 due to Census 2021 revisions, published on 1 March 2024.\n\nPoland: data revised from January 2019 to June 2023 due to Census 2021 revisions, published on 1 March 2024.\n\nMalta: data revised from January 2018 to January 2024 due to Census 2021 revisions, published on 3 April 2024 and partially updated on 2 October.\n\nSpain: data revised from January 2021 to December 2023 due to Census 2021 revisions, published on 3 May 2024.\n\nPortugal: data revised from February 2011 to June 2023 due to Census 2021 revisions, published on 30 August 2024.\n\nBulgaria: data revised from January 2019 to December 2022 due to Census 2021 revisions, published on 30 August 2024.\_\n\nCyprus: data revised for all quarters of 2021 due to Census 2021 revisions, published on 2 October 2024.\n\nGermany: data revised back to 2009 due to Census 2021 revisions, published on 3 June 2025.\n\nFrance: data revised back to 2003 due to the inclusion of Mayotte, published on 1 October 2026.\_\n\nMajor revisions are communicated via email to the main users such as the EC DG Employment, the ECB and the OECD.\n\n3\\. Unscheduled revisions\n\nLithuania: NSA, SA and Trend series revised for the period October - December 2021 as well as the period October - December 2022 (for the breakdowns Employed Male aged 25-74 as well as Unemployed Male aged 25-74) due to an error in the benchmarking.\n\nLithuania: NSA, SA, Trend series revised for the period July - September 2023 for all breakdowns due to an error in data restrictions.\n\nBoth revisions for Lithuania were published on 1 March 2024.\n\nA link to the most recent news release can be found at the bottom of the page \"[Unemployment Statistics](http://ec.europa.eu/eurostat/statistics-explained/index.php/Unemployment_statistics#Publications \"Unemployment Statistics\")\" in Statistics Explained, section Publications.\n\nFor information on\_EU-LFS data revisions, please consult\_[EU-LFS (Statistics Explained) -\_Data and publication](http://ec.europa.eu/eurostat/statistics-explained/index.php/EU_labour_force_survey_%E2%80%93_data_and_publication \"EU-LFS (Statistics Explained) -\_Data and publication\").\_\n\n## 18\\. Statistical processing accordion arrow down accordion arrow up\n\n### 18.1. Source data\n\nThe EU-LFS\_is the main data source of the monthly unemployment data.\_A complete overview of the data sources used, by country, could be found in the paper **'Sources and Methods'** available as annex to this metadata.\n\nThere are legislative acts of the European Council and Parliament and of the European Commission that govern the\_*EU-LFS*\_(see section 6 ‘Institutional Mandate’ as well as the related metadata \"employ\\_esms\" at the bottom of the page) and result in the production of monthly and quarterly \_- or only quarterly - labour force statistics.\n\nFor the countries where only quarterly statistics is compiled, Eurostat is complementing this quarterly data with a monthly indicator from public employment authority delivered by the Member States. The results of the complementary calculations yield the monthly unemployment data. See annex **'Technical details unemployment calculations**' below in this metadata.\n\nThe data for US and Japan are produced by the\_[U.S. Bureau of Labor Statistics](https://www.bls.gov/ \"U.S. Bureau of Labor Statistics\")\_and the Ministry of Internal Affairs and Communications Government of Japan, respectively. Eurostat disseminates those data without any processing.For additional information please refer to the technical annex below or\_consult the\_[EU-LFS (Statistics Explained) webpage.](http://ec.europa.eu/eurostat/statistics-explained/index.php/EU_labour_force_survey \"EU-LFS (Statistics Explained) webpage.\")\n\n### 18.2. Frequency of data collection\n\nMonthly.\n\n### 18.3. Data collection\n\nEU-LFS data are acquired by interviewing the sampled individuals directly.\_\n\nFor more information please consult the\_overview of the data sources used, that could be found in the paper\_**'Sources and Methods'**\_available as annex to this metadata. the corresponding LFS quality reports.\n\nMost Member States transmit the data via Edamis, while some just send them via email to the monthly unemployment functional mailbox. The files sent via Edamis are automatically stored in a specific folder on the Fame server, while those sent via email are manually copied in the same folder. All files are then treated exactly in the same way.\n\n### 18.4. Data validation\n\nEurostat performs the seasonal adjustment (SA) for countries delivering monthly unemployment inputs (such as administrative unemployment counts) as detailed in Article 3 of Commission Implementing Regulation (EU) 2019/2241.\_\n\nFor the rest of the countries, delivering monthly unemployment statistics or estimates, the SA data is delivered together with the NSA series.\n\n### 18.5. Data compilation\n\nThe following method is used in order to produce monthly unemployment rates: for all countries, the non-seasonally adjusted quarterly averages of the monthly series are benchmarked to the quarterly LFS figures. However, the way the figures for the individual months as well as the provisional figures (for the period when LFS data are not yet available) are calculated depends on the availability and specific characteristics of the sources available in individual Member States. Eurostat aims at harmonizing the calculation process as much as possible. Apart from quarterly figures, in some Member States monthly and/or 3 month moving averages are produced from the LFS as well. Registered unemployment data are used for many Member States as auxiliary source. The length of the series and specific correlation with the unemployment figures as measured with the quarterly LFS varies from country to country.\n\n**Czech Republic, Denmark, Germany, Greece, Hungary, Italy, the Netherlands, Austria, Romania, Finland, Sweden, Iceland, Norway and Turkey.**\n\nMonthly estimates are available directly from the LFS.\_ For Germany, the Netherlands and Iceland, trend data instead of seasonally adjusted data is published due to the high volatility of the series. For Finland, Sweden and Norway trend data is the headline monthly indicator, while seasonally adjusted data are also available in the online dataset. For Romania, only quarterly LFS\_figures for youth unemployment are published. For Turkey the age breakdown 25-74 is to be interpreted as 25+ due to the national methodology.\n\n**Estonia and Portugal**\n\nThree month moving averages are available directly from the LFS, and are published as monthly figures under the middle month. The last of the three months is nowcasted for Denmark, Estonia and Portugal.\n\n**Lithuania**\n\nQuarterly LFS data are combined with monthly registered unemployment data using an AR (1) max log approach for temporal disaggregation and forecasting.\_\n\n**Belgium, Bulgaria, Spain, France, Cyprus, Latvia, Poland and Slovakia**\n\nQuarterly LFS data are combined with monthly registered unemployment data using a temporal disaggregation Denton model. For the most recent months (for which the LFS data are not yet available), the monthly benchmark factors are forecasted using seasonal ARIMA regression models. The provisional estimates are calculated by multiplying these factors by the available registered unemployment figures. See the Annex for technical details. It is important to note that the LFS in Belgium introduced a panel design in Q1 2017. For Belgium, Croatia, Cyprus and Slovenia only quarterly LFS figures for youth unemployment are published.\n\n**France**\n\nEstimates are calculated using inputs from the French public employment service. An [updated national methodology](https://dares.travail-emploi.gouv.fr/dossier/les-inscrits-france-travail \"updated national methodology \") (in French) is in use since January 2025, affecting the time series consistency of the input data. To ensure the comparability of monthly unemployment figures published in this article, Eurostat compiled the evolution between December 2024 and January 2025 youth unemployment figures using statistical models.\n\n**Luxembourg, Croatia, Bosnia and Herzegovina, North Macedonia**\_\n\nBenchmarking to moving annual averages of LFS data and linear extrapolation of registered unemployment data.\n\n**Switzerland**\n\nQuarterly LFS data are combined with monthly registered unemployment data using a linear proportional disaggregation. No data are disseminated for the most recent months (for which the LFS data are not yet available).\n\nFor all countries data compilation takes place for eight basic series in the levels: (employed and unemployed)x(males and females)x(young and adults).\_\n\nThe levels for the European aggregates are obtained by simply adding up the national data (see below for adjustments on country data).\n\nRates both for each country and for the EU aggregates are subsequently calculated from the data expressed in levels (i.e. number of persons).\n\n### 18.6. Adjustment\n\nWhere available, LFS series adjusted for breaks are used in the production for the monthly unemployment series.\n\nSeasonal adjustment is done by Eurostat for Member States delivering monthly unemployment inputs only, on a disaggregated level (country by gender by age group, indirect approach) using TRAMO/SEATS (and X-13 trend calculation for Germany).\n\nFor more information on the transition to a quarterly continuous survey, see [EU-LFS (Statistics Explained) webpage: Development and history](http://ec.europa.eu/eurostat/statistics-explained/index.php/EU_labour_force_survey_%E2%80%93_development_and_history \"EU-LFS (Statistics Explained) webpage: Development and history\").\n\n## 19\\. Comment accordion arrow down accordion arrow up\n\nSee annexes.\n\n## Related metadata accordion arrow down accordion arrow up\n\n[Employment and unemployment (Labour force survey) (employ) - employ\\_esms](https://ec.europa.eu/eurostat/cache/metadata/EN/employ_esms.htm)  \n[LFS main indicators (lfsi) - lfsi\\_esms](https://ec.europa.eu/eurostat/cache/metadata/EN/lfsi_esms.htm)  \n\n## Annexes accordion arrow down accordion arrow up\n\n[Technical details unemployment calculations](../Annexes/une_rt_m_esms_an_1.pdf \"une_rt_m_esms_an_1.pdf\")  \n[Sources and methods for MUR](../Annexes/une_rt_m_esms_an_Sources_and_methods_for_MUR.pdf \"une_rt_m_esms_an_Sources_and_methods_for_MUR.pdf\")  \n[Quality assessment of MUR data](../Annexes/une_rt_m_esms_an_Quality_assessment_of_MUR_data.pdf \"une_rt_m_esms_an_Quality_assessment_of_MUR_data.pdf\")  \n\n## Footnotes accordion arrow down accordion arrow up\n\n[Unemployment by sex and age - monthly data \\[ESTAT\\_UNE\\_RT\\_M\\_110.0-Modified\\]](../Annexes/une_rt_m_esms_an_footnote.xlsx \"une_rt_m_esms_an_footnote.xlsx\")  \n\n## Data description\n\n'Unemployment by sex and age - monthly data' is a dataset with series on a monthly basis which is, where necessary, adjusted and enriched in various ways, in accordance with the specificities of the indicator.\_The monthly unemployment indicator is calculated with special methods and periodicity which justify the present page.\n\nQuarterly and annual unemployment is published in the section 'LFS main indicators', which is a collection of the main statistics on the labour market.\_\n\nThis page focuses on the particularities of the estimation of harmonised unemployment (including unemployment rates). Other information on 'LFS main indicators' can be found in the respective ESMS page, see link in section 'related metadata'.\_\n\n## Metadata last update\n\n8 January 2026\n\n## Statistical concepts and definitions\n\nThe definitions of employment and unemployment, as well as other survey characteristics follow the definitions and recommendations of the International Labour Organisation. The definition of unemployment is further precised in Commission Regulation (EC) No\_2019/2240.\n\nThe relevant definitions are as follows:\n\n**Unemployed persons**\_are all persons 15 to 74 years of age who were not employed during the reference week, had actively sought work during the past four weeks and were ready to begin working immediately or within two weeks. Figures show the number of persons unemployed in thousands.\n\nThe duration of unemployment is defined as the duration of a search for a job or as the length of the period since the last job was held (if this period is shorter than the duration of search for a job).\n\n**Employed persons**\_are all persons who worked at least one hour for pay or profit during the reference week or were temporarily absent from such work. This variable is needed for the calculation of the unemployment rate,\_the long term unemployment rate and the very long term unemployment rate (see definition below). For the unemployment rate, only persons from 15 to 74 years of age are used.\n\n**The unemployment rate**\_is the number of people unemployed as a percentage of the labour force. The labour force is the total number of people employed and unemployed. In the database, unemployment rates can be downloaded by choosing the unit \"PC\\_ACT\", Percentage of Active Population.\n\nThe\_**active population**\_(labour force) is defined as the sum of employed and unemployed persons.\n\n## Statistical unit\n\nPersons.\n\n## Statistical population\n\nThe EU LFS results cover the total population usually residing in Member States, except for persons living in collective or institutional households. While demographic data are gathered for all age groups, questions relating to labour market status are restricted to persons in the age group of 15 years or older. For more details and exceptions, please consult please consult the\_[EU-LFS (Statistics Explained) - Methodology](http://ec.europa.eu/eurostat/statistics-explained/index.php/EU_labour_force_survey_-_methodology \"EU-LFS (Statistics Explained) - Methodology\").\n\n## Reference area\n\nEuropean Union, Euro area, EU Member States, Candidate Countries, EFTA Countries (except for Liechtenstein).\n\nData for Cyprus refer only to the areas of Cyprus controlled by the Government of the Republic of Cyprus.\n\nData for France include the overseas departments (DOM).\_\n\nData for USA and Japan are also disseminated.\n\n## Reference Period\n\nThe reference periods are the calendar months.\_\n\n## Accuracy - overall\n\nThe overall accuracy is considered as high. Unemployment is arguably the most important variable collected by EU-LFS, the survey design is optimized to measure unemployment.\n\n## Unit of measure\n\nUnemployment rates are expressed in percentage (see definition above in section 3.4), while unemployment levels are thousands of persons.\n\n## Data compilation\n\nThe following method is used in order to produce monthly unemployment rates: for all countries, the non-seasonally adjusted quarterly averages of the monthly series are benchmarked to the quarterly LFS figures. However, the way the figures for the individual months as well as the provisional figures (for the period when LFS data are not yet available) are calculated depends on the availability and specific characteristics of the sources available in individual Member States. Eurostat aims at harmonizing the calculation process as much as possible. Apart from quarterly figures, in some Member States monthly and/or 3 month moving averages are produced from the LFS as well. Registered unemployment data are used for many Member States as auxiliary source. The length of the series and specific correlation with the unemployment figures as measured with the quarterly LFS varies from country to country.\n\n**Czech Republic, Denmark, Germany, Greece, Hungary, Italy, the Netherlands, Austria, Romania, Finland, Sweden, Iceland, Norway and Turkey.**\n\nMonthly estimates are available directly from the LFS.\_ For Germany, the Netherlands and Iceland, trend data instead of seasonally adjusted data is published due to the high volatility of the series. For Finland, Sweden and Norway trend data is the headline monthly indicator, while seasonally adjusted data are also available in the online dataset. For Romania, only quarterly LFS\_figures for youth unemployment are published. For Turkey the age breakdown 25-74 is to be interpreted as 25+ due to the national methodology.\n\n**Estonia and Portugal**\n\nThree month moving averages are available directly from the LFS, and are published as monthly figures under the middle month. The last of the three months is nowcasted for Denmark, Estonia and Portugal.\n\n**Lithuania**\n\nQuarterly LFS data are combined with monthly registered unemployment data using an AR (1) max log approach for temporal disaggregation and forecasting.\_\n\n**Belgium, Bulgaria, Spain, France, Cyprus, Latvia, Poland and Slovakia**\n\nQuarterly LFS data are combined with monthly registered unemployment data using a temporal disaggregation Denton model. For the most recent months (for which the LFS data are not yet available), the monthly benchmark factors are forecasted using seasonal ARIMA regression models. The provisional estimates are calculated by multiplying these factors by the available registered unemployment figures. See the Annex for technical details. It is important to note that the LFS in Belgium introduced a panel design in Q1 2017. For Belgium, Croatia, Cyprus and Slovenia only quarterly LFS figures for youth unemployment are published.\n\n**France**\n\nEstimates are calculated using inputs from the French public employment service. An [updated national methodology](https://dares.travail-emploi.gouv.fr/dossier/les-inscrits-france-travail \"updated national methodology \") (in French) is in use since January 2025, affecting the time series consistency of the input data. To ensure the comparability of monthly unemployment figures published in this article, Eurostat compiled the evolution between December 2024 and January 2025 youth unemployment figures using statistical models.\n\n**Luxembourg, Croatia, Bosnia and Herzegovina, North Macedonia**\_\n\nBenchmarking to moving annual averages of LFS data and linear extrapolation of registered unemployment data.\n\n**Switzerland**\n\nQuarterly LFS data are combined with monthly registered unemployment data using a linear proportional disaggregation. No data are disseminated for the most recent months (for which the LFS data are not yet available).\n\nFor all countries data compilation takes place for eight basic series in the levels: (employed and unemployed)x(males and females)x(young and adults).\_\n\nThe levels for the European aggregates are obtained by simply adding up the national data (see below for adjustments on country data).\n\nRates both for each country and for the EU aggregates are subsequently calculated from the data expressed in levels (i.e. number of persons).\n\n## Source data\n\nThe EU-LFS\_is the main data source of the monthly unemployment data.\_A complete overview of the data sources used, by country, could be found in the paper **'Sources and Methods'** available as annex to this metadata.\n\nThere are legislative acts of the European Council and Parliament and of the European Commission that govern the\_*EU-LFS*\_(see section 6 ‘Institutional Mandate’ as well as the related metadata \"employ\\_esms\" at the bottom of the page) and result in the production of monthly and quarterly \_- or only quarterly - labour force statistics.\n\nFor the countries where only quarterly statistics is compiled, Eurostat is complementing this quarterly data with a monthly indicator from public employment authority delivered by the Member States. The results of the complementary calculations yield the monthly unemployment data. See annex **'Technical details unemployment calculations**' below in this metadata.\n\nThe data for US and Japan are produced by the\_[U.S. Bureau of Labor Statistics](https://www.bls.gov/ \"U.S. Bureau of Labor Statistics\")\_and the Ministry of Internal Affairs and Communications Government of Japan, respectively. Eurostat disseminates those data without any processing.For additional information please refer to the technical annex below or\_consult the\_[EU-LFS (Statistics Explained) webpage.](http://ec.europa.eu/eurostat/statistics-explained/index.php/EU_labour_force_survey \"EU-LFS (Statistics Explained) webpage.\")\n\n## Frequency of dissemination\n\nMonthly.\n\n## Timeliness\n\nMonthly data on seasonally adjusted unemployment rates are published approximately 31 days after the end of the reference month.\_\n\n## Comparability - geographical\n\nFor France, the LFS results for the monthly calculations are complemented with the DOM data (départements d'outre-mer).\n\n## Comparability - over time\n\nIn the monthly dataset, the idea is to keep the time series as comparable in time as possible. It means that possible breaks in the LFS series due to changes in the definitions or in the filtering of the micro data have been adjusted.\n\n![Close](https://ec.europa.eu/eurostat/cache/metadata/img/close.svg) \n\n [![Eurostat logo](https://ec.europa.eu/eurostat/o/estat-theme-ecl/images/header/estat-logo-horizontal.svg?browserId=other&minifierType=js&languageId=en_GB&t=1762164022000)](https://ec.europa.eu/eurostat/web/main/home)\n\nThis site is managed by [Eurostat](https://ec.europa.eu/eurostat/web/main/home) and is an official website of the European Union\n\n-   [Accessibility](https://ec.europa.eu/eurostat/web/main/help/accessibility)\n\n## Need help?\n\n-   [Sitemap](/eurostat/web/main/sitemap)\n-   [Contact us](/eurostat/web/main/contact-us)\n\n## Follow us\n\n-   [X](https://x.com/EU_Eurostat)\n-   [Facebook](https://www.facebook.com/EurostatStatistics/)\n-   [Instagram](https://www.instagram.com/eu_eurostat/)\n-   [LinkedIn](https://www.linkedin.com/company/eurostat/)\n-   [Youtube](https://youtube.com/c/Eurostat-EC)\n-   [RSS](/eurostat/web/rss/about-rss)\n\n [![European Union logo](https://ec.europa.eu/eurostat/o/estat-theme-ecl/images/logo/condensed-version/positive/logo-eu--en.svg?browserId=other&minifierType=js&languageId=en_GB&t=1762164022000)](https://european-union.europa.eu/index_en)\n\n[Discover more on europa.eu](https://european-union.europa.eu/index_en)\n\n## Contact the EU\n\n-   [Call us 00 800 6 7 8 9 10 11](tel:0080067891011)\n-   [Use other telephone options](https://european-union.europa.eu/contact-eu/call-us_en)\n-   [Write