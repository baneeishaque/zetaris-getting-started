          content: |
            # Eurostat CRUD

            A small Angular 22 example that saves Eurostat unemployment-rate filters in the browser and
            fetches the matching observations from the public Eurostat API. It is a standalone, zoneless
            application with no backend, authentication, database, or Zetaris API key.

            The verified dataset notes live in the repository dossier:
            [`docs/data-sources/eurostat/`](../../docs/data-sources/eurostat/README.md).

            ## Run locally

            Requires Node.js 26 and npm 11.

            ```bash
            npm install
            npm start
            ```

            Open `http://localhost:4200/`. The development server reloads on source changes.

            ```bash
            npm test -- --watch=false   # Vitest unit tests
            npm run build               # production bundle in dist/
            ```

            ## Routes

            | Route | Purpose |
            | --- | --- |
            | `/series` | List saved series, empty state, storage warnings |
            | `/series/new` | Create a saved series |
            | `/series/:id` | Fetch and inspect observations, edit or delete |
            | `/series/:id/edit` | Edit a saved series |

            The app redirects `/` and unknown routes to `/series`.

            ## Data

            The app calls:

            ```text
            https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/une_rt_m
            ```

            It always sends `freq=M`, `s_adj=SA`, `age=TOTAL`, `unit=PC_ACT`, and `format=JSON`. The only
            user-selectable dimensions are:

            - `geo`: `PL`, `DE`, `FR`, `ES`, `IT`
            - `sex`: `T`, `M`, `F`

            The service validates the JSON-stat dataset, decodes flat value indexes, drops non-finite values,
            sorts observations by period, and caches successful responses for five minutes. The detail page
            shows the latest 24 observations by default and can reveal the full history.

            ## Storage

            Saved series use the browser `localStorage` key `eurostat-crud.saved-series.v1` with this envelope:

            ```json
            { "version": 1, "items": [] }
            ```

            Records are validated on load; invalid items are ignored with a warning. Corrupt raw JSON is copied
            to `eurostat-crud.saved-series.v1.corrupt` before the app starts empty. Data never leaves the
            browser except for the public Eurostat request.

            ## Limitations

            - No accounts, server sync, export, or cross-device storage.
            - Depends on Eurostat API availability and browser CORS behavior.
            - The chart is a compact SVG trend view, not a full statistical charting tool.
            - The example intentionally does not use Zetaris or any private credentials.

            ## Attribution

            Source: [Eurostat, `une_rt_m`](https://ec.europa.eu/eurostat/databrowser/view/une_rt_m/default/table)
            (unemployment rate, monthly). Reuse is subject to the
            [Eurostat copyright notice](https://ec.europa.eu/eurostat/about-us/policies/copyright). The
            dataset's statistical data is not presented as CC BY 4.0; see the
            [license and attribution dossier](../../docs/data-sources/eurostat/license-and-attribution.md).

            ## Structure

            ```text
            src/app/
              core/eurostat/       JSON-stat model, API client, tests
              core/series/         Saved-series model, labels, localStorage store, tests
              features/            List, form, and detail pages
              shared/rate-chart/   Standalone SVG line chart
            ```
