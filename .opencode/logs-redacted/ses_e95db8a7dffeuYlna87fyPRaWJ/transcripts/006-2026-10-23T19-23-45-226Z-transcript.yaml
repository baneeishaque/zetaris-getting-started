      ​## Objective
      - Analyse the onboarded Eurostat database and produce a maximum-detail, structured documentation dossier plus a simple Angular CRUD app.
      - First produce a maximum-detail implementation plan per `/home/ext_root/lab-data/ai-suite/ai-agent-rules/ai-agent-planning-rules.md`; implementation starts only after explicit approval.

      ## Important Details
      - **User decisions (locked):**
        - Docs location: `docs/data-sources/eurostat/`.
        - App architecture: pure Angular + `localStorage`, calling the Eurostat public REST API directly; no Node BFF, SQLite, or Zetaris key.
        - CRUD scope: saved series + notes; Eurostat observations stay read-only.
        - App location: `examples/eurostat-crud/`.
      - **Docs dossier (8 files):** `README.md`, `dataset-profile.md`, `data-dictionary.md`, `api-reference.md`,
        `zetaris-integration.md`, `data-quality.md`, `operations-runbook.md`, `license-and-attribution.md`.
      - **App scope:** Angular 22.2.4, standalone, zoneless, strict, Vitest; saved-series CRUD in `localStorage`; observations from
        `une_rt_m`; allowlist `geo` = PL/DE/FR/ES/IT and `sex` = T/M/F; fixed `freq=M`, `age=TOTAL`, `unit=PC_ACT`, `s_adj=SA`.
      - **CRUD model:** `SavedSeries { id, name, note, filters: { geo, sex }, createdAt, updatedAt }`; storage key
        `eurostat-crud.saved-series.v1`; envelope `{ version: 1, items: [...] }`; corrupt payload backed up to
        `eurostat-crud.saved-series.v1.corrupt`.
      - **App routes:** `''` → `/series`, `/series`, `/series/new`, `/series/:id`, `/series/:id/edit`, wildcard redirect.
      - **Planned app files:** `core/eurostat/eurostat.models.ts|eurostat.service.ts|eurostat.service.spec.ts|eurostat.fixture.ts`,
        `core/series/saved-series.model.ts|series-store.service.ts|series-store.service.spec.ts`,
        `features/series-list/`, `features/series-form/`, `features/series-detail/`, `shared/rate-chart/` (inline SVG, no chart dependency),
        plus app shell, README, styles, and generated config.
      - **Exact scaffold command:**
        ```sh
        cd /home/ext_root/lab-data/zetaris-getting-started
        mise x node@26 -- npx --yes @angular/cli@22.2.4 new eurostat-crud \
          --directory examples/eurostat-crud \
          --defaults --skip-git --style=css --routing --ssr=false \
          --zoneless --strict --test-runner=vitest --package-manager=npm --prefix=app
        ```
        Then `cd examples/eurostat-crud && mise x node@26 -- npm install`.
      - **Angular 22 scaffold verified** (probe at `/tmp/opencode/probe`, `--skip-install`): generated `app.ts`, `app.html`, `app.css`,
        `app.config.ts`, `app.routes.ts`, `app.spec.ts`; `package.json` scripts `ng`, `start`, `build`, `watch`, `test`;
        deps `@angular/* ^22.2.0`, `rxjs ~7.8.0`, `tslib ^2.3.0`; devDeps `@angular/build ^22.2.4`, `@angular/cli ^22.2.4`,
        `@angular/compiler-cli ^22.2.0`, `jsdom ^30.0.0`, `prettier ^3.8.1`, `typescript ~6.0.2`, `vitest ^5.0.0`;
        `packageManager: npm@11.19.1`; generated `.gitignore` covers `/.angular/cache`, `/dist`, `/node_modules`, `/coverage`.
      - **Angular app config:** add `provideHttpClient(withFetch())`; default is `provideBrowserGlobalErrorListeners()` + `provideRouter(routes)`;
        `app.ts` uses signal title + `RouterOutlet`; `tsconfig.spec.json` uses `vitest/globals`; spec pattern uses `TestBed` and `await fixture.whenStable()`.
      - **Eurostat API:** `https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/une_rt_m`; params
        `format=JSON&lang=EN&geo=<GEO>&sex=<SEX>&age=TOTAL&unit=PC_ACT&s_adj=SA`; CORS open; public/no key.
      - **JSON-stat parsing:** invert `dimension.time.category.index`, compute the flat index with `id`/`size`, read numeric `value` entries,
        sort by `YYYY-MM`; `2026-09` is the latest overall period but has no value.
      - **Verified coverage (all sexes identical per country):** PL 356 values 1997-01..2026-08, 169 missing;
        DE 428 1991-01..2026-08, 97 missing; FR 524 1983-01..2026-08, 1 missing; ES 485 1986-04..2026-08, 40 missing;
