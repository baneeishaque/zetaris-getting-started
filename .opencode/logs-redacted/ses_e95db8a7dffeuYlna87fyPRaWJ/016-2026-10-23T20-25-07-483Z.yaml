          191: 
          192: ## Limits
          193: 
          194: - **Poland only.** The registration URL fixes `geo=PL`.
          195: - **One sex.** The registration URL fixes `sex=T`.
          196: - **One age class.** The registration URL fixes `age=TOTAL`.
          197: - **One unit.** The registration URL fixes `unit=PC_ACT`.
          198: - **One adjustment.** The registration URL fixes `s_adj=SA`.
          199: - **No status flags in the series view.** The raw `status` struct has two entries for PL, but the decoded view
          200:   does not expose them.
          201: - **No history.** The registration returns the current vintage. Revisions overwrite prior values.
          202: - **Dynamic structs.** `value`, `status`, and `dimension.time.category.index` are structs with one field per
          203:   key. Do not treat them as maps without coercion.
          204: - **Snapshot view is narrow.** It has three columns and ends at `2026-07`.
          205: - **REST table is a registration, not a cache guarantee.** Treat queries as reads against the registered
          206:   endpoint; do not assume a local copy or a vintage.
          207: 
          208: ## Adding another country
          209: 
          210: There is no runtime parameter on the registered REST table. To add Germany, for example, create a second
          211: registration with `geo=DE` and a distinct table name:
          212: 
          213: ```sql
          214: CREATE LIGHTNING REST TABLE une_rt_m_de FROM EUROSTAT_REST REQUEST(
          215:     endpoint "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/une_rt_m?format=JSON&geo=DE&sex=T&age=TOTAL&unit=PC_ACT&s_adj=SA&lang=EN",
          216:     method "get",
          217:     response_type "json",
          218:     http_encoding "URLENCODED"
          219: ) HEADER (
          220: ) BODY ();
          221: ```
          222: 
          223: Then create the same three views with `de` names. This is a live change and is not part of this dossier. For
          224: ad-hoc analysis, the public API is simpler and avoids creating one table per country.
          225: 
          226: ## Security
          227: 
          228: - The Zetaris API key lives in `.env.local` and is used only by the repository's SQL helpers.
          229: - Never put `ZETARIS_API_KEY` in a browser app, a notebook, a screenshot, or a document.
          230: - The Eurostat endpoint itself needs no key.
          231: - The REST table registration does not add authentication to Eurostat; it adds a Zetaris object that reads
          232:   the public endpoint.
          233: 
