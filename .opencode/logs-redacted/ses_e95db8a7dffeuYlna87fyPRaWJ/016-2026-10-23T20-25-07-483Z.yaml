          1: # Zetaris integration
          2: 
          3: This document describes the Eurostat registration that already exists in the Zetaris instance. It is a
          4: single-country slice of `une_rt_m`, not a general Eurostat connector. The raw REST table is backed by the
          5: public endpoint; the three views decode or expose parts of the JSON-stat response.
          6: 
          7: ## Object inventory
          8: 
          9: | Object | Type | Identifier | Purpose |
          10: | :--- | :--- | :--- | :--- |
          11: | Eurostat database | Lightning database | `EUROSTAT_REST` (id 917) | Registration container. |
          12: | Eurostat container | Schemastore container | `eurostat` | Holds the decoded views. |
          13: | Raw slice | REST table | `EUROSTAT_REST.une_rt_m_pl` | JSON-stat response for Poland, total sex, total age, `PC_ACT`, `SA`. |
          14: | Metadata view | Schemastore view | `eurostat.une_rt_m_pl_metadata_table` | Dataset label, source, update timestamp, geo labels, time index map. |
          15: | Snapshot view | Schemastore view | `eurostat.une_rt_m_pl_snapshot_table` | Three fixed rate columns. |
          16: | Series view | Schemastore view | `eurostat.une_rt_m_pl_series_table` | One `(period, rate)` row per populated month. |
          17: 
          18: The raw table name is written as `EUROSTAT_REST.une_rt_m_pl` in the registration and referenced as
          19: `eurostat_rest.une_rt_m_pl` in the view definitions. Zetaris identifiers are case-insensitive in these
          20: examples; use the casing shown in the object inventory when writing new SQL.
          21: 
          22: ## Registration request
          23: 
          24: The source is registered with `CREATE LIGHTNING REST TABLE`. The exact request block from
          25: [`07_eurostat_create.sql`](../../../open_data/rest_apis/sql/non_rate_limited/07_eurostat_create.sql) is:
          26: 
          27: ```sql
          28: CREATE LIGHTNING REST TABLE une_rt_m_pl FROM EUROSTAT_REST REQUEST(
          29:     endpoint "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/une_rt_m?format=JSON&geo=PL&sex=T&age=TOTAL&unit=PC_ACT&s_adj=SA&lang=EN",
          30:     method "get",
          31:     response_type "json",
          32:     http_encoding "URLENCODED"
          33: ) HEADER (
          34: ) BODY ();
          35: ```
          36: 
          37: The request has no headers and no body. The endpoint fixes the slice; there are no runtime parameters. To
          38: register a different country or sex, create a separate REST table with a different URL and table name.
          39: 
          40: The database and container are created first:
          41: 
          42: ```sql
          43: CREATE LIGHTNING DATABASE EUROSTAT_REST DESCRIBE BY "Eurostat REST API JSON-stat source";
          44: CREATE SCHEMASTORE CONTAINER eurostat;
          45: ```
          46: 
          47: ## View definitions
          48: 
          49: ### Metadata view
          50: 
          51: ```sql
          52: CREATE SCHEMASTORE VIEW une_rt_m_pl_metadata_table WITH CONTAINER eurostat AS
          53: SELECT
          54:     label AS dataset_label,
          55:     source AS dataset_source,
          56:     updated AS last_updated,
          57:     dimension.geo.category.label AS geo_labels,
          58:     dimension.time.category.index AS time_index_map
          59: FROM eurostat_rest.une_rt_m_pl;
          60: ```
          61: 
          62: This view is safe to query without `explode()`. It returns one row with:
          63: 
          64: | Column | Type | Observed value |
          65: | :--- | :--- | :--- |
          66: | `dataset_label` | string | `Unemployment by sex and age - monthly data` |
          67: | `dataset_source` | string | `ESTAT` |
          68: | `last_updated` | string | `2026-10-21T11:00:00+0200` |
          69: | `geo_labels` | `struct<PL:string>` | `{"PL":"Poland"}` |
          70: | `time_index_map` | struct with 525 `bigint` fields | Period-to-index map, including `2026-09` |
          71: 
          72: `time_index_map` is a struct, not a map. It is convenient for direct backtick access, but it is not directly
          73: `explode()`-able without JSON coercion.
          74: 
          75: ### Snapshot view
          76: 
          77: ```sql
          78: CREATE SCHEMASTORE VIEW une_rt_m_pl_snapshot_table WITH CONTAINER eurostat AS
          79: SELECT
          80:     value.`168` AS rate_1997_01,
          81:     value.`510` AS rate_2025_07,
          82:     value.`522` AS rate_2026_07
          83: FROM eurostat_rest.une_rt_m_pl;
          84: ```
          85: 
          86: The view has exactly three columns. It is a spot check, not a wide-format snapshot. The indices are:
          87: 
          88: | Column | Flat index | Period | Observed value |
          89: | :--- | ---: | :--- | ---: |
          90: | `rate_1997_01` | 168 | 1997-01 | 11.8 |
          91: | `rate_2025_07` | 510 | 2025-07 | 3.1 |
          92: | `rate_2026_07` | 522 | 2026-07 | 3.4 |
          93: 
          94: The series view includes `2026-08`, but the snapshot view does not. Do not use the snapshot view as the
          95: latest-value source.
          96: 
          97: ### Series view
          98: 
          99: ```sql
          100: CREATE SCHEMASTORE VIEW une_rt_m_pl_series_table WITH CONTAINER eurostat AS
          101: SELECT
          102:     time_label AS period,
          103:     CAST(rate_value AS DOUBLE) AS unemployment_rate_pct
          104: FROM eurostat_rest.une_rt_m_pl
          105: LATERAL VIEW explode(from_json(to_json(value), 'map<string,double>')) AS time_key, rate_value
          106: LATERAL VIEW explode(from_json(to_json(dimension.time.category.index), 'map<string,bigint>')) AS time_label, time_index_value
          107: WHERE CAST(time_key AS INT) = time_index_value;
          108: ```
          109: 
          110: Both dynamic-key objects are coerced with `from_json(to_json(...))`. A plain `explode()` fails because
          111: Zetaris infers both objects as structs, not maps. The join compares the stringified flat index in `value`
          112: with the integer time index.
          113: 
          114: The view has two columns:
          115: 
          116: | Column | Type | Meaning |
          117: | :--- | :--- | :--- |
          118: | `period` | string | Calendar month in `YYYY-MM` form. |
          119: | `unemployment_rate_pct` | double | Unemployment rate as a percentage of the labour force. |
          120: 
          121: It has 356 rows, one per populated month. It does not carry the source status flags.
