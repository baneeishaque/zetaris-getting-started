          240: DROP VIEW eurostat.une_rt_m_pl_metadata_table;
          241: DROP VIEW eurostat.une_rt_m_pl_snapshot_table;
          242: DROP VIEW eurostat.une_rt_m_pl_series_table;
          243: ```
          244: 
          245: The underlying REST table and Lightning database are removed through the Zetaris Data Explorer; the script
          246: notes that there is no SQL path for those objects. Do not run teardown as part of routine verification.

