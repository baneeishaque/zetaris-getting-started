          <content>
          1: # Agent instructions
          2: 
          3: This repo is a set of tested onboarding material for Zetaris: install guide, `open_data/` source packages
          4: (`*_create.sql` / `*_select.sql` pairs), helper scripts in `scripts/`, SQL references in `docs/guides/`, and
          5: runnable examples in `examples/` (`examples/eurostat-crud-java/` is a Spring Boot JDBC demo;
          6: `examples/eurostat-crud/` is an Angular browser CRUD example). You are acting as a data engineer against a
          7: Zetaris instance.
          8: 
          9: ## Connect first
          10: 
          11: The user's first prompt names a protocol (JDBC or REST) and a goal. Which instance you talk to is set in `.env.local` (`ZETARIS_REST_URL`, `ZETARIS_JDBC_URL` and the rest; local is the default), not in the prompt. Before running anything else, read the connection guide for your harness in `docs/connections/` (`claude-code-connection.md`, `codex-connection.md`, `cursor-connection.md`) for the settings table and troubleshooting, run the preflight below, and confirm the connection with `SELECT 1` and `SHOW LIGHTNING DATABASES`. Over REST, also call `GET /datasource/datasources`. Then work on the user's goal.
          12: 
          13: - **JDBC:** use `ZETARIS_JDBC_JAR` if set; otherwise ask the user for the full path to the driver JAR. Do not assume or search for it.
          14: - **REST:** the key is `ZETARIS_API_KEY` in `.env.local`, created by the user in the Zetaris GUI. Never create, request, print, log or put it in a URL.
          15: - **OpenAPI spec:** fetch it fresh from `/redoc/docs.yaml` using Basic auth (`ZETARIS_USERNAME` and `ZETARIS_PASSWORD` from `.env.local`), not the bearer key. See section 6.4 of the connection guide.
          16: - **Finding `.env.local`:** it is the only env file; do not use `.env`. It is gitignored, so a git worktree has none. Every script in `scripts/` (Python and Deno) already looks in the repo root and then the top-level checkout. For your own shell commands, use the snippet in the preflight section.
          17: 
          18: ## Preflight check
          19: 
          20: Run this before any Zetaris work in a new session, and report what is missing. Do not install anything, create credentials, or start work until the user has seen the result. Ask before installing.
          21: 
          22: Run `python3 scripts/preflight.py` (add `--jdbc --jar <path>` for JDBC). It is read-only and covers the checklist below; the list is what it checks and why. Run SQL files with `python3 scripts/run_sql.py FILE` (`--dry-run` first, `--skip-exists` to re-run, `--channel jdbc` for JDBC); see `scripts/HOWTO.md`.
          23: 
          24: 1. **Credentials.** Find `.env.local` (see "Connect first"). Check that these names are set, without printing values: `ZETARIS_API_KEY` for REST, and `ZETARIS_USERNAME` / `ZETARIS_PASSWORD` for the OpenAPI spec and for JDBC. Also note `ZETARIS_JDBC_JAR` (driver path, JDBC only) and `ZETARIS_USER_AGENT` (needed by any create script containing the `YOUR_APP_NAME YOUR_CONTACT_EMAIL` placeholder).
          25:    ```bash
          26:    ENV="$(dirname "$(cd "$(git rev-parse --git-common-dir)" && pwd)")/.env.local"
          27:    set -a; . "$ENV"; set +a
          28:    for v in ZETARIS_API_KEY ZETARIS_USERNAME ZETARIS_PASSWORD; do [ -n "$(printenv "$v")" ] && echo "$v set" || echo "$v MISSING"; done
          29:    ```
          30: 2. **REST.** `GET /datasource/datasources` returns 200, and `SELECT 1` through `/sql-editor/sqls/run` returns `1`. A 401 means a bad key; a 400 means a bad `X-Org-ID` or a non-UUID `X-Request-ID`. If localhost fails with `Operation not permitted` before an HTTP response, treat it as a possible command-environment network restriction, not an API or credential failure. Request approved/elevated execution for the same read-only preflight and retry when available. If access is unavailable or denied, report the blocker and stop; do not change the endpoint or credentials to work around it.
          31: 3. **JDBC** (only if the user wants JDBC):
          32:    - **Endpoint:** `nc -z localhost 10000` succeeds.
          33:    - **Java:** JDK 11 or later. On macOS `java` can be a stub that reports "Unable to locate a Java Runtime" even when a Homebrew JDK exists. Check `/usr/libexec/java_home`, then `/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home`, and export `JAVA_HOME`. If none exists, offer `brew install openjdk@17`. The `temurin` cask needs `sudo`, which the agent cannot enter.
          34:    - **Python:** a venv (`.venv` is gitignored) with `jaydebeapi` importable.
          35:    - **Driver JAR:** ask the user for the full path and confirm the file exists. Never assume a location.
          36:    - **Query:** connect with `jdbc:zetaris:lightning@localhost:10000` and class `com.zetaris.lightning.jdbc.LightningDriver`, then run `SELECT 1`.
