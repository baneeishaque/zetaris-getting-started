          146:   the Netherlands, Sweden, the United Kingdom, and the United States.
          147: - Ireland, the Netherlands, and Sweden have values through `2026-09` in the full dataset.
          148: - The five-country comparison ends at `2026-08` for all five countries; `2026-09` is empty for them.
          149: - The registered PL slice ends at `2026-08`; `2026-09` is present in the time axis but has no value.
          150: - Country-specific start dates explain most of the missing leading months. They are not gaps in an otherwise
          151:   continuous series.
          152: 
          153: ## Update and revision
          154: 
          155: ### Source update
          156: 
          157: The live dataset reports `updated` as `2026-10-21T11:00:00+0200`. The same timestamp appears in the
          158: `UPDATE_DATA`, `UPDATE_GLOBAL`, and `UPDATE_PLANNED` annotations. The structural metadata was last updated on
          159: `2026-10-08`; footnotes were last updated on `2026-10-09`.
          160: 
          161: The dataset version is `2.0` (JSON-stat). The data structure version is `156.0` (`UNE_RT_M`, agency `ESTAT`).
          162: The dataset version and the data structure version are different things; do not use one as a substitute for
          163: the other.
          164: 
          165: ### Revision policy
          166: 
          167: Eurostat's monthly unemployment revision policy has three layers:
          168: 
          169: 1. **Routine revisions.** New validated data update the already disseminated series. Aggregates and components
          170:    are revised together. Routine revisions aim to keep the monthly series temporally consistent with the
          171:    quarterly LFS. Seasonal adjustment models are reviewed annually, and the annual review can revise
          172:    seasonally adjusted history.
          173: 2. **Major revisions.** These follow methodological changes, census revisions, or changes in geographical
          174:    coverage. Breaks are flagged until break-free data are provided.
          175: 3. **Unscheduled revisions.** These correct validated errors and are documented in the news release.
          176: 
          177: For routine revisions, data are considered final after six months. The following major revisions affect the
          178: countries in this dossier:
          179: 
          180: | Country | Revision | Published |
          181: | :--- | :--- | :--- |
          182: | Poland | Data revised from January 2019 to June 2023 due to Census 2021 revisions | 2024-03-01 |
          183: | Germany | Data revised back to 2009 due to Census 2021 revisions | 2025-06-03 |
          184: | France | Data revised back to 2003 due to the inclusion of Mayotte | 2026-10-01 |
          185: | Spain | Data revised from January 2021 to December 2023 due to Census 2021 revisions | 2024-05-03 |
          186: 
          187: The France revision is the most recent major revision affecting a country in the five-country comparison. It
          188: was published less than a month before this dossier's verification date, which is a reminder that the source
          189: is not static.
          190: 
          191: ## Methodology
          192: 
          193: ### Data source
          194: 
          195: The EU-LFS is the main data source. Where a country compiles only quarterly LFS data, Eurostat complements it
          196: with a monthly indicator from the national public employment authority. The monthly series is then produced
          197: through a harmonised process.
          198: 
          199: For Poland, the ESMS states that quarterly LFS data are combined with monthly registered unemployment data
          200: using a **Denton temporal disaggregation** model. For the most recent months, where LFS data are not yet
          201: available, the monthly benchmark factors are forecast using **seasonal ARIMA regression** models. The
          202: provisional estimates are the product of those factors and the available registered unemployment figures.
          203: This is why the Polish series can be revised when new LFS data arrive.
          204: 
          205: ### Seasonal adjustment
          206: 
          207: For countries that deliver monthly unemployment inputs, Eurostat performs the seasonal adjustment at a
          208: disaggregated level (country by sex by age group, indirect approach) using **TRAMO/SEATS**. Germany uses
          209: **X-13** for trend calculation. The registered Zetaris slice uses the `SA` series, not `NSA` or `TC`.
          210: 
          211: ### Timeliness
          212: 
          213: Monthly seasonally adjusted unemployment rates are published approximately **31 days after the end of the
          214: reference month**. The source timestamp is the authoritative record of when the current vintage was produced.
          215: 
          216: ### Legal basis
          217: 
          218: The EU-LFS is governed by Regulation (EU) 2019/1700 and its implementing regulations, in particular
          219: Commission Implementing Regulation (EU) 2019/2241. The statistical definitions follow ILO recommendations.
          220: 
          221: ## Scope and limitations
          222: 
          223: - **One country in Zetaris.** The registered objects contain Poland only. The full dataset has 38 geography
          224:   categories, but the Zetaris table is a single-country slice.
          225: - **Fixed dimensions in Zetaris.** `sex=T`, `age=TOTAL`, `unit=PC_ACT`, and `s_adj=SA` are fixed by the
          226:   registration URL. The full dataset has 3 sex codes, 3 age codes, 2 units, and 3 adjustment codes.
          227: - **No microdata.** The dataset contains aggregated rates and levels, not person-level records.
          228: - **No vintage history.** The API returns the current vintage. Revisions overwrite prior values; the source
          229:   timestamp is the only built-in vintage marker.
          230: - **Status flags are metadata, not filters.** The Zetaris series view does not carry the status flags. A
          231:   consumer that needs them must read the raw `status` object from the API or the REST table.
          232: - **The latest month can be empty.** `2026-09` is in the time axis but has no value for the registered slice
          233:   or for the five-country comparison. Do not treat the last time position as the last observation.
          234: - **Commercial reuse has geography limits.** Eurostat's general reuse permission does not cover commercial
          235:   reuse of data for countries outside the EU, EFTA, and official EU acceding and candidate countries. The
          236:   five-country comparison uses EU countries only, but the full dataset includes the United States and Japan.
