          1: # getting-started
          2: 
          3: Data recipes, connection helpers, and guides for making external data queryable in Zetaris and building a project from it. Source licenses and verification limits are recorded in the catalogs.
          4: 
          5: ## Start here
          6: 
          7: Read [START-HERE.md](START-HERE.md) first. Participants use their own Zetaris instance, either downloaded locally or deployed through AWS.
          8: 
          9: 1. **Confirm access.** For a local installation, start at [Zetaris Cloud](https://www.zetaris.com/cloud) to obtain the platform bundle, then follow the [installation guide](docs/install/updated_zetaris_installation_guide.md). For an existing instance, use your supplied URL and account. This repo supplies the recipes and guides; platform accounts and JDBC drivers are separate.
          10: 2. **Connect and execute one query.** Choose SQL Editor, agent JDBC, or the HTTP helpers in the [connection guide](docs/connections/README.md).
          11: 3. **Verify a small dataset.** Follow [your first dataset](docs/guides/first-dataset.md): a minimal PokéAPI JSON subset; PUDL is now known to fail. Execute complete statements separately and inspect actual rows.
          12: 4. **Choose your project.** Follow an [analysis, data-product, or application path](docs/guides/project-paths.md), then use the [demo template](docs/guides/demo-template.md).
          13: 
          14: CREATE/SELECT pairs are available for the active REST and file sources. Read their headers and select the statements you need. The single-query helper's `--file` option sends the whole file as one request. For multi-command files use the new `run_sql.py` runner; source/model dependencies are declared in `open_data/manifest.json` and planned by `onboard.py`. REST verification queries are generally commented out. Do not treat a whole recipe as an automatically executed migration.
          15: 
          16: Use [recipe readiness](docs/guides/recipe-readiness.md) to choose later sources and [troubleshooting](docs/guides/troubleshooting.md) for partial setup or errors. See the [event page](https://hackathon.genai.works/event/open-agent-hackathon-2026) for support and submission details.
          17: 
          18: ## Documentation map
          19: 
          20: The [GitHub Pages guide](website/README.md) describes how to preview and publish the onboarding website from this branch. It renders the existing guides directly from Markdown.
          21: 
          22: | Doc | What it's for |
          23: |---|---|
          24: | [`docs/install/`](docs/install/) | Installing and configuring Zetaris (local or AWS), and the record of what's been tested |
          25: | [`docs/connections/README.md`](docs/connections/README.md) | SQL Editor, Cursor/Codex/Claude Code JDBC and REST choices; included recipe and full command references |
          26: | [Full Lightning command reference](docs/guides/zetaris-lightning-sql-commands.md) | Platform command syntax; use the smaller recipe reference for the starter |
          27: | [`open_data/rest_apis/`](open_data/rest_apis/) | REST/JSON API sources — catalog, HOWTO, and `sql/*_create.sql` + `*_select.sql` pairs |
          28: | [`open_data/parquet_csv/`](open_data/parquet_csv/) | Parquet/CSV file sources — same catalog/HOWTO/sql pattern |
          29: | [`open_data/usl/`](open_data/usl/) | Unified Semantic Layer contrast build — the same EDGAR+SIC data product, rebuilt with USL instead of REST+VDM |
          30: | [`scripts/`](scripts/) | Preflight, dependency-aware onboarding, multi-command execution, API helpers, and local fetchers |
          31: | [`open_data/manifest.json`](open_data/manifest.json) | Source/model IDs, status, and dependencies for `onboard.py` |
          32: | [`docs/guides/project-paths.md`](docs/guides/project-paths.md) | Optional project directions, including the [PUDL chart](examples/pudl-chart/README.md) and [EDGAR/PUDL/NOAA guide](docs/guides/create-edgar-pudl-noaa-usl.md) |
          33: | [`docs/guides/zetaris-lightning-sql-companion.md`](docs/guides/zetaris-lightning-sql-companion.md) | SQL reference: shapes, quoting, gotchas, and confirmed platform limitations — read alongside the Zetaris Kbase while writing your own SQL |
          34: | [`docs/plans/FUTURES.md`](docs/plans/FUTURES.md) | The full data-source roadmap, priority order, and status per category |
          35: | [`docs/plans/`](docs/plans/) | Active plans for in-progress or upcoming work; [`docs/plans/archive/`](docs/plans/archive/) holds completed or superseded plans and the original source-research manifest, kept as historical record |
          36: 
          37: ## Repo layout
          38: 
          39: ```
          40: open_data/
          41:   rest_apis/      REST/JSON API sources — HOWTO, source catalog, sql/*_create.sql + *_select.sql pairs
          42:   parquet_csv/     Parquet/CSV file sources — same HOWTO/catalog/sql pattern
          43:   usl/             Unified Semantic Layer contrast build (EDGAR+SIC, rebuilt with USL instead of REST+VDM)
          44: scripts/
          45:   check_zetaris.*, query_zetaris.*, ping_postgres.*, zetaris_api.* — TypeScript and Python helpers
          46: examples/
          47:   pudl-chart/      One query through the HTTP helper to a local HTML chart
          48: docs/
          49:   connections/     Route choices, Cursor/Codex/Claude Code prompts, and recipe command reference
          50:   install/         Installation & configuration guide, plus its test record
          51:   guides/          First dataset, project paths, readiness, recovery, and demo guidance
          52:   plans/           Active roadmap and category plans (FUTURES.md, recipes/); archive/ for completed plans
          53: ```
          54: 
          55: Folders are added as each category in the roadmap actually ships, rather than scaffolded up front — see [`docs/plans/FUTURES.md`](docs/plans/FUTURES.md) for where this is headed.
          56: 
          57: ## Client scripts
          58: 
          59: [`scripts/`](scripts/) now includes `preflight.py`, `run_sql.py`, and dependency-aware `onboard.py`, alongside TypeScript (Deno) and Python helpers for connecting to the Zetaris HTTP API and checking a PostgreSQL connection, plus two standalone Python downloaders for the Parquet/CSV package's not-yet-registered sources. See [`scripts/HOWTO.md`](scripts/HOWTO.md) for setup, environment variables, and usage for both languages.
          60: 
          61: ## Contributing
          62: 
