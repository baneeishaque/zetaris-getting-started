          27: ## Statistical concept
          28: 
          29: The dataset measures **unemployment** using the International Labour Organization definitions used by the
          30: European Union Labour Force Survey (EU-LFS). The relevant concepts are:
          31: 
          32: - **Unemployed persons** are persons aged 15 to 74 who were not employed during the reference week, had
          33:   actively sought work during the past four weeks, and were ready to begin working immediately or within two
          34:   weeks.
          35: - **Employed persons** are persons who worked at least one hour for pay or profit during the reference week,
          36:   or who were temporarily absent from such work.
          37: - **The labour force** (active population) is the sum of employed and unemployed persons.
          38: - **The unemployment rate** is the number of unemployed persons as a percentage of the labour force.
          39: 
          40: The dataset is monthly. Quarterly and annual unemployment is published separately in the LFS main indicators
          41: collection. The monthly series is produced with methods specific to the indicator, including temporal
          42: disaggregation and seasonal adjustment; it is not a simple monthly resampling of the quarterly LFS.
          43: 
          44: For the registered Zetaris slice the rate is expressed as `PC_ACT`, "Percentage of population in the labour
          45: force". The dataset also contains `THS_PER` ("Thousand persons") for unemployment levels, but the Zetaris
          46: registration selects only `PC_ACT`.
