          11:   - response: |-
          12:       **Short answer:** Eurostat inside Zetaris is a **read-only view**. CRUD needs a writable target. H2 is that target for **app-owned annotations**, not a copy of Eurostat.
          13: 
          14:       **What lives where**
          15: 
          16:       | Store | Data | Permission |
          17:       | :--- | :--- | :--- |
          18:       | Zetaris `EUROSTAT_REST` | Eurostat observations and metadata | `SELECT` only |
          19:       | H2 `series_notes` | Note text, tag, rating, pinned flag, timestamps, `period` | Full CRUD |
          20: 
          21:       The app validates that `period` exists in Eurostat before inserting a note. There is no cross-system foreign key; the join is logical.
          22: 
          23:       **Why H2 specifically**
          24: 
          25:       - Embedded in the JVM: no separate service, Docker, or credentials.
          26:       - Transactional with unique constraints and generated keys.
          27:       - One local file, trivial to reset.
          28:       - Swappable: replacing H2 with Postgres changes the `DataSource` and schema, not the service/repository design.
          29: 
          30:       **Alternatives**
          31: 
          32:       - External Postgres/MySQL: more realistic, but requires a running service and operations.
          33:       - A writable source registered in Zetaris: then the app could use only Zetaris JDBC, but it requires administrator provisioning and changes the scope.
          34: 
          35:       ### Two-store ownership
          36: 
          37:       ```mermaid
          38:       flowchart LR
          39:           subgraph Z["Zetaris - read model"]
          40:               E["Eurostat observations<br/>period, unemployment_rate_pct"]
          41:           end
          42:           subgraph A["Application - write model"]
          43:               N["series_notes<br/>period, note_text, tag, rating, pinned"]
          44:           end
          45:           E -. logical join on period .-> N
          46:       ```
          47: 
          48:       ### Read workflow
          49: 
          50:       ```mermaid
          51:       sequenceDiagram
          52:           autonumber
          53:           participant B as Browser
          54:           participant C as Controller
          55:           participant R as EurostatRepository
          56:           participant Z as Zetaris JDBC
          57:           participant E as Eurostat view
          58:           B->>C: GET /series
          59:           C->>R: findAll()
          60:           R->>Z: SELECT period, unemployment_rate_pct
          61:           Z->>E: read-only scan
          62:           E-->>Z: rows
          63:           Z-->>R: ResultSet
          64:           R-->>C: observations
          65:           C-->>B: Thymeleaf HTML
          66:       ```
          67: 
          68:       ### Write workflow
          69: 
          70:       ```mermaid
          71:       sequenceDiagram
          72:           autonumber
          73:           participant B as Browser
          74:           participant C as NoteController
          75:           participant S as SeriesNoteService
          76:           participant E as EurostatRepository
          77:           participant H as H2
          78:           B->>C: POST /notes
          79:           C->>S: create(form)
          80:           S->>E: existsByPeriod(period)
          81:           E-->>S: true / false
          82:           alt period missing
          83:               S-->>C: validation error
          84:               C-->>B: form + error
          85:           else period exists
          86:               S->>H: INSERT note
          87:               alt duplicate period
          88:                   H-->>S: unique violation
          89:                   S-->>C: duplicate error
          90:                   C-->>B: form + error
          91:               else inserted
          92:                   H-->>S: generated id
          93:                   S-->>C: saved note
          94:                   C-->>B: 302 redirect to /notes
          95:               end
          96:           end
          97:       ```
          98: 
          99:       ### Store-selection decision
          100: 
          101:       ```mermaid
          102:       flowchart TD
          103:           A["CRUD over Eurostat"] --> B{"Can Zetaris write<br/>Eurostat rows?"}
          104:           B -->|No| C["Pick a writable store"]
          105:           B -->|Yes| D["Provision a writable source<br/>in Zetaris"]
          106:           C --> H2["H2 file DB"]
          107:           C --> PG["Postgres / MySQL"]
          108:           D --> Z["App uses Zetaris JDBC only"]
          109:           H2 --> N["Notes keyed to a Eurostat period"]
          110:           PG --> N
          111:           Z --> N
          112:       ```
          113: 
          114:       Added as Q11 and §4.6 in the plan; markdown lint still reports 0 issues.
