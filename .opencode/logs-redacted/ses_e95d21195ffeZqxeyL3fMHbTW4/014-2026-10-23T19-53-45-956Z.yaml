            ## 7. Configuration

            ### 7.1 Environment Variables

            | Variable | Required | Purpose |
            | :--- | :---: | :--- |
            | `ZETARIS_JDBC_URL` | Yes | JDBC URL; default `jdbc:zetaris:lightning@localhost:10000` |
            | `ZETARIS_JDBC_USER` | Yes | Zetaris username |
            | `ZETARIS_JDBC_PASSWORD` | Yes | Zetaris password |
            | `ZETARIS_JDBC_JAR` | Install only | Absolute path to `ndp-jdbc-driver-2.1.0.13-driver.jar` |
            | `SERVER_PORT` | No | Overrides `8090`; not used in the demo |

            Secrets are read from the process environment. The app never reads `.env.local` directly; `run.sh` sources it.

            ### 7.2 `application.yml`

            ```yaml
            spring:
              application:
                name: eurostat-crud
              thymeleaf:
                cache: false

            server:
              port: 8090
              address: 127.0.0.1

            app:
              zetaris:
                url: ${ZETARIS_JDBC_URL:jdbc:zetaris:lightning@localhost:10000}
                username: ${ZETARIS_JDBC_USER:}
                password: ${ZETARIS_JDBC_PASSWORD:}
                driver-class-name: com.zetaris.lightning.jdbc.LightningDriver
                query-timeout-seconds: 15
              demo:
                seed-notes: true
            ```

            There is no `spring.datasource` block and no H2 URL.

            ### 7.3 `application-test.yml`

            ```yaml
            app:
              demo:
                seed-notes: false
              zetaris:
                url: jdbc:zetaris:lightning@localhost:10000
                username: test
                password: test
            ```

            The test profile does not connect unless a test explicitly queries. `@SpringBootTest` context loading creates
            the driver and DataSource but does not open a connection.

            ### 7.4 `run.sh`

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail
            cd "$(dirname "$0")"

            set -a
            # shellcheck disable=SC1091
            source ../../.env.local
            set +a

            exec mvn -q spring-boot:run
            ```

            `../../.env.local` resolves to `/home/ext_root/lab-data/zetaris-getting-started/.env.local`.

            ### 7.5 Driver Installation Script

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            JAR="${1:-${ZETARIS_JDBC_JAR:-}}"
            if [[ -z "$JAR" ]]; then
              echo "Usage: $0 /path/to/ndp-jdbc-driver-2.1.0.13-driver.jar" >&2
              echo "   or: ZETARIS_JDBC_JAR=/path/to/driver.jar $0" >&2
              exit 1
            fi
            if [[ ! -f "$JAR" ]]; then
              echo "Driver JAR not found: $JAR" >&2
              exit 1
            fi

            mvn install:install-file \
              -Dfile="$JAR" \
              -DgroupId=com.zetaris \
              -DartifactId=lightning-jdbc \
              -Dversion=2.1.0.13-local \
              -Dpackaging=jar
            ```

            The script is idempotent: re-installing the same JAR overwrites the local artifact. The JAR remains in its
            original location and is never copied into the repository.

