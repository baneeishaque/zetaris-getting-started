          1: #!/usr/bin/env python3
          2: """audit-version-coverage.py — literal section-by-section coverage audit.
          3: 
          4: Compares two versions of the SAME markdown artifact and reports, per
          5: section of the OLD document, whether the NEW document covers / enhances /
          6: drops it. Emits a deterministic FULL / PARTIAL / MISSING verdict.
          7: 
          8: Tier: 1 (Python 3.12+) — see scripting-language-selection-rules.md §3.
          9: Read-only; never mutates its inputs.
          10: """
          11: 
          12: from __future__ import annotations
          13: 
          14: import argparse
          15: import json
          16: import re
          17: import sys
          18: from pathlib import Path
          19: 
          20: SECTION_RE = re.compile(r"^(#{2,6})\s+(.*)$")
          21: 
          22: COVERED = "COVERED"
          23: ENHANCED = "ENHANCED"
          24: DROPPED = "DROPPED"
          25: 
          26: 
          27: def normalize_heading(text: str) -> str:
          28:     return re.sub(r"\s+", " ", text.strip()).lower()
          29: 
          30: 
          31: def normalize_body(text: str) -> str:
          32:     return re.sub(r"\s+", " ", text.strip()).strip()
          33: 
          34: 
          35: def parse_sections(text: str, heading_filter: re.Pattern[str]) -> list[dict]:
          36:     """Split doc into sections: heading text, level, and body until next heading."""
          37:     sections: list[dict[str, object]] = []
          38:     current: dict[str, object] | None = None
          39:     body_lines: list[str] = []
          40: 
          41:     def flush() -> None:
          42:         nonlocal current, body_lines
          43:         if current is not None:
          44:             current["body"] = normalize_body("\n".join(body_lines))
          45:             sections.append(current)
          46:         current = None
          47:         body_lines = []
          48: 
          49:     for line in text.splitlines():
          50:         m = SECTION_RE.match(line)
          51:         if m:
          52:             flush()
          53:             heading = m.group(2).strip()
          54:             if heading_filter.search(m.group(0)):
          55:                 current = {"heading": heading, "norm": normalize_heading(heading), "body": ""}
          56:         elif current is not None:
          57:             body_lines.append(line)
          58:     flush()
          59:     return sections
          60: 
          61: 
          62: def classify_old(old: dict[str, object], new_sections: list[dict[str, object]]) -> dict[str, object]:
          63:     head = old.get("norm", "")
          64:     old_body = str(old.get("body", ""))
          65:     for new in new_sections:
          66:         if new.get("norm") == head:
          67:             new_body = str(new.get("body", ""))
          68:             if old_body in new_body:
          69:                 classification = ENHANCED if len(new_body) > len(old_body) else COVERED
          70:                 return {
          71:                     "old_heading": old.get("heading"),
          72:                     "class": classification,
          73:                     "new_heading": new.get("heading"),
          74:                 }
          75:             # same heading but body not a superset — try the next duplicate heading
          76:             # before declaring DROPPED (duplicate headings with stubs like "(see top)")
          77:     return {"old_heading": old.get("heading"), "class": DROPPED, "new_heading": None}
          78: 
          79: 
          80: def main() -> int:
          81:     ap = argparse.ArgumentParser(description=__doc__)
          82:     ap.add_argument("--old", required=True, help="old artifact path (vN)")
          83:     ap.add_argument("--new", required=True, help="new artifact path (vN+1)")
          84:     ap.add_argument("--json", action="store_true", help="machine-readable JSON output")
          85:     ap.add_argument("--headings", default=r"^##\s|^###\s", help="regex matching headings to audit (default ## and ###)")
          86:     args = ap.parse_args()
          87: 
          88:     old_path = Path(args.old)
          89:     new_path = Path(args.new)
          90: 
          91:     if not old_path.is_file():
          92:         print(json.dumps({"error": f"old file not found: {old_path}"}) if args.json else f"error: old file not found: {old_path}")
          93:         return 1
          94:     if not new_path.is_file():
          95:         print(json.dumps({"error": f"new file not found: {new_path}"}) if args.json else f"error: new file not found: {new_path}")
          96:         return 1
          97: 
          98:     try:
          99:         heading_filter = re.compile(args.headings)
          100:     except re.error as exc:
          101:         print(f"usage error: bad --headings regex: {exc}")
          102:         return 2
          103: 
          104:     old_text = old_path.read_text(encoding="utf-8", errors="replace")
          105:     new_text = new_path.read_text(encoding="utf-8", errors="replace")
          106: 
          107:     old_sections = parse_sections(old_text, heading_filter)
          108:     new_sections = parse_sections(new_text, heading_filter)
          109: 
          110:     rows = [classify_old(old, new_sections) for old in old_sections]
          111:     dropped = [r for r in rows if r["class"] == DROPPED]
          112:     verdict = "FULL" if not dropped else "PARTIAL"
          113:     if not old_sections:
          114:         verdict = "MISSING"
          115: 
          116:     result = {
          117:         "old": str(old_path),
          118:         "new": str(new_path),
          119:         "old_sections": len(old_sections),
          120:         "new_sections": len(new_sections),
          121:         "verdict": verdict,
          122:         "rows": rows,
          123:     }
          124: 
          125:     if args.json:
          126:         print(json.dumps(result, indent=2, default=str))
          127:     else:
          128:         print(f"old_sections={result['old_sections']} new_sections={result['new_sections']} verdict={verdict}")
          129:         for r in rows:
          130:             print(f"{r['class']:8} {r.get('old_heading', '')} -> {r.get('new_heading', 'NO MATCH')}")
          131: 
          132:     return 0 if verdict == "FULL" else 1
          133: 
          134: 
          135: if __name__ == "__main__":
