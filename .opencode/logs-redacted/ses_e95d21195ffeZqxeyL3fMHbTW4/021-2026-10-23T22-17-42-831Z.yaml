          ### 7.5 Driver Installation Script

          ```bash
          #!/usr/bin/env bash
          set -euo pipefail

          JAR="${1:-${ZETARIS_JDBC_JAR:-}}"
          if [[ -z "$JAR" ]]; then
            echo "Usage: $0 /path/to/ndp-jdbc-driver-2.4.3.1-driver.jar" >&2
            echo "   or: ZETARIS_JDBC_JAR=/path/to/driver.jar $0" >&2
            exit 1
          fi
          if [[ ! -f "$JAR" ]]; then
            echo "Driver JAR not found: $JAR" >&2
            exit 1
          fi

          mvn install:install-file \
            -Dfile="$JAR" \
            -DgroupId=com.zetaris \
            -DartifactId=lightning-jdbc \
            -Dversion=2.4.3.1-local \
            -Dpackaging=jar
          ```

          The script is idempotent: re-installing the same JAR overwrites the local artifact. The JAR remains in its
