                        SeriesNote note = invocation.getArgument(0);
                        return new SeriesNote(
                                1L, note.period(), note.noteText(), note.tag(), note.rating(), note.pinned(),
                                note.createdAt(), note.updatedAt());
                    });

                    SeriesNoteForm form = form(" 2025-07 ", "  text  ");
                    form.setTag("  latest ");
