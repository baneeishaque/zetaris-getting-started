      `<div th:replace="${content}"></div>` works if content fragment returns element. If content fragment is `th:fragment="content"` on `<section>`, replacement yields section. Good.

      But `th:replace="${content}"` syntax: Thymeleaf allows `th:replace="${content}"` (expression returning fragment signature). Yes.

