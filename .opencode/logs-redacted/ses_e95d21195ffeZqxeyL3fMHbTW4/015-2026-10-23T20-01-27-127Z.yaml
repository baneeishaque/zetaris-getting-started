                        }
                        return ResponseEntity.status(HttpStatus.SERVICE_UNAVAILABLE)
                                .body(Map.<String, Object>of("status", "DOWN", "zetaris", "DOWN"));
                    } catch (RuntimeException ex) {
                        return ResponseEntity.status(HttpStatus.SERVICE_UNAVAILABLE)
                                .body(Map.<String, Object>of("status", "DOWN", "zetaris", "DOWN"));
                    }
                }
            }
