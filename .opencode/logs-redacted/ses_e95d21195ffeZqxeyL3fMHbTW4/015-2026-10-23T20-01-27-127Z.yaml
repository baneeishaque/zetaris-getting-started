              model.addAttribute("noteId", id);
              return "notes/form";
          }
          @PostMapping("/{id}")
          public String update(@PathVariable long id, @Valid @ModelAttribute("form") SeriesNoteForm form, BindingResult bindingResult, Model model, RedirectAttributes redirectAttributes) {
              if (bindingResult.hasErrors()) { model.addAttribute("isEdit", true); model.addAttribute("noteId", id); return "notes/form"; }
              try { noteService.update(id, form); redirectAttributes.addFlashAttribute("message", "Note updated."); return "redirect:/notes"; }
              catch (DuplicateNoteException | UnknownPeriodException ex) { bindingResult.rejectValue("period", "note.period", ex.getMessage()); model.addAttribute("isEdit", true); model.addAttribute("noteId", id); return "notes/form"; }
          }
          @PostMapping("/{id}/delete")
          public String delete(@PathVariable long id, RedirectAttributes redirectAttributes) {
              try { noteService.delete(id); redirectAttributes.addFlashAttribute("message", "Note deleted."); }
              catch (NoteNotFoundException ex) { redirectAttributes.addFlashAttribute("error", ex.getMessage()); }
              return "redirect:/notes";
          }
      }
