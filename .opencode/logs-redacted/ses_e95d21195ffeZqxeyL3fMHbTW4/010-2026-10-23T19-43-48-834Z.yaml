      **Why H2?**

      1. Eurostat is a read-only REST-backed view in Zetaris. The platform exposes `SELECT` (and metadata), not `INSERT/UPDATE/DELETE` on that data. So a CRUD app cannot use Eurostat as its write store.
      2. CRUD needs a writable, transactional store. H2 is the smallest one that:
         - runs embedded in the JVM (no separate service, no Docker, no credentials),
         - persists to a local file,
         - supports transactions, constraints, generated keys,
         - is trivial to reset/delete,
         - keeps the demo focused on the JDBC integration, not on DB ops.
      3. H2 does **not** duplicate Eurostat. It stores only app-owned annotations: `period`, `note_text`, `tag`, `rating`, `pinned`, timestamps. The Eurostat observations stay in Zetaris; the app joins them logically by `period` at request time.
      4. The alternative is not "no second DB"; it's "some writable store." Options:
         - External Postgres/MySQL: more realistic for production, but requires a running service, schema, credentials, and ops.
         - A writable source registered in Zetaris (e.g., Postgres USL): then the app could use only Zetaris JDBC, but it requires administrator provisioning and changes the scope from "consume Eurostat" to "provision a writable source."
         - H2: zero external dependencies, ideal for a runnable example.
      5. If the user's actual goal is "CRUD the Eurostat numbers," that's not possible without changing the source; the app would need to own a copy (bad: drift) or write to an upstream system that Eurostat doesn't provide. So the plan's interpretation is the only honest one.

